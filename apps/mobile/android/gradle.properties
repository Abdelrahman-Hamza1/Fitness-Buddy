# Heap caps for the owner's 7 GB laptop (S06 plan D19, research "S06 — Android
# toolchain"): the template's -Xmx8G/4G would push it into swap. CI may raise them
# in ~/.gradle/gradle.properties (that file wins over this one). Laptop make
# targets run `./gradlew --stop` after a build.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
