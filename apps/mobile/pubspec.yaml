name: fb_mobile
description: Fitness Buddy, the Flutter app (Android in R1, D-081).
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

# Versions: S06 plan D1 (research "S06 — Flutter package set"). Exact pins are
# bumped on purpose, never by Dependabot (see .github/dependabot.yml): codegen
# and goldens change with them. riverpod_lint is not here: it is an analyzer
# plugin, pinned in the root analysis_options.yaml.
dependencies:
  # UUIDv5 natural IDs (A01 D6). Already in the lockfile.
  crypto: ^3.0.7
  # Same exact pin as fb_api_client (its generated code runs on it).
  dio: 5.11.1
  # Local database (A01 D13-D15). Exact pin: drift and drift_dev are a codegen
  # pair, bumped together on purpose (like riverpod). No drift_flutter (why:
  # lib/core/db/connection.dart).
  drift: 2.35.2
  fb_api_client:
    path: ../../packages/fb_api_client
  # Tokens, themes and components (A02). Screens build UI from it only.
  fb_design_system:
    path: ../../packages/fb_design_system
  fb_domain:
    path: ../../packages/fb_domain
  # Query normalization for the offline catalog search (A05 D10).
  fb_text:
    path: ../../packages/fb_text
  flutter:
    sdk: flutter
  # Needed by the gen-l10n output (lib/l10n/gen). The app's delegates come
  # from material_ui (plan D15), not from this package.
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  # A20 PA1/PA2: native barrier maps this exact release; re-audit before bumping.
  flutter_secure_storage: 11.2.0
  go_router: ^18.0.2
  # A50 D1: Google sign-in (Credential Manager on Android), BSD-3, flutter.dev.
  # Exact pin like the other auth-sensitive plugin; used only in
  # lib/core/account/google_plugin_id_token_source.dart.
  google_sign_in: 7.2.0
  intl: ^0.20.2
  material_ui: 1.6.0
  # A28a D13: barcode scanner (CameraX + bundled ML Kit barcode model, so the
  # first scan works offline), BSD-3. Adds android.permission.CAMERA
  # (asked at first use; camera hardware not required). Exact pin; used only
  # in lib/features/foods/presentation/barcode/.
  mobile_scanner: 7.4.2
  # X-App-Version and the update gate read the installed version.
  package_info_plus: ^10.2.2
  # The profile database directory (A01 D13).
  path_provider: ^2.1.5
  riverpod_annotation: 4.0.7
  # Error reporting, after the first frame, off while the DSN is empty.
  sentry_flutter: ^10.0.0
  # BSD-3 OS multi-file sharing; no permissions or network (A11).
  share_plus: 13.3.1
  # The device id and the cached /v1/config (not secret, not user data).
  shared_preferences: ^2.5.6
  # Direct: drift's `setup` callback gets a sqlite3 Database (pragmas). sqlite3
  # 3.x bundles SQLite through build hooks (sqlite3_flutter_libs is EOL). Hook
  # overrides (user_defines) go in the root pubspec only (A01 plan §3.5).
  sqlite3: ^3.7.1

dev_dependencies:
  alchemist: 0.14.1
  build_runner: 2.16.1
  # drift's code generator and migration tooling (make-migrations), pinned
  # with drift.
  drift_dev: 2.35.1
  flutter_test:
    sdk: flutter
  # A21 engine-only profile gate: Flutter SDK device test runner.
  integration_test:
    sdk: flutter
  # Integration tests in patrol_test/ (S06 plan D18). Exact pin: its Android
  # runner is wired into android/app/build.gradle.kts and must match the
  # patrol_cli the Makefile activates (PATROL_CLI_VERSION, compatibility table
  # at patrol.leancode.co). Bumped on purpose, with patrol_cli.
  patrol: 4.10.0
  riverpod_generator: 4.0.9
  # Test only: the in-memory SharedPreferencesAsync platform (the plugin's
  # documented way to test it). Comes with shared_preferences.
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: 11.0.0

flutter:
  uses-material-design: true
  # The bundled catalog pack and its manifest (A05 D7); `make catalog-pack`
  # writes them (gitignored), the installer copies the pack on first run.
  assets:
    - assets/catalog/
  # Required by `flutter gen-l10n` (it refuses to run without it).
  generate: true

# Patrol (S06 plan D18): `make test-it` runs patrol_test/ on a device or
# emulator, `make build-it` only builds the APKs. The dev flavor's app, so
# package_name has the flavor's applicationIdSuffix (android/app/build.gradle.kts).
patrol:
  app_name: FB Dev
  flavor: dev
  android:
    package_name: io.github.abdelrahmanhamza1.fitnessbuddy.dev
