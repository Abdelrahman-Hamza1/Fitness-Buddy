# Fitness Buddy CI: the one workflow and the one required check.
#
# Jobs `dart`, `dotnet` and `contract` run the same `make` targets as a laptop
# does. The API contract checks (`make check-contract`, TD-023) are spread over
# three jobs so that no toolchain is set up or built twice (S02 D13):
#   contract  bundle fresh, Spectral lint, self-test, breaking-change report
#             (Docker only, no Flutter or .NET)
#   dart      gen-check: the committed Dart client is what the generator produces
#   dotnet    contract-conformance: the Host's OpenAPI document matches the
#             contract (reuses the Release build of the job; runs before the
#             tests, so a server-only drift shows the conformance message
#             first, not a Contract.Tests failure)
# Every check runs exactly once. The gate job `ci` always runs and passes only if
# every job it `needs` succeeded; it is the only check the `main` ruleset requires
# (S01 A1). New gates (catalog, eval, android) are added as jobs here and to
# `ci.needs`, so the ruleset never changes.
#
# No path filtering (S01 A2): every push runs everything.
# Actions are pinned to full commit SHAs; Dependabot (github-actions) bumps them.
name: CI

on:
  push:
    branches: ['**', '!dependabot/**'] # Dependabot branches run via pull_request
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly run on main (Mon 04:00 UTC): new NuGet advisories (NuGetAudit) and
    # toolchain drift surface without a commit.
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  # One run per branch or PR: a newer push cancels the older run. On main every
  # run gets its own group (run_id), so nothing there is cancelled or dropped.
  group: ci-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash # bash -eo pipefail

jobs:
  dart:
    name: dart
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter (version from .fvmrc)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
          # The action appends -<hashFiles('**/pubspec.lock')> to this key itself.
          pub-cache-key: 'flutter-pub-:os:-:version:-:arch:'

      # Tool paths are overridden on the command line (S01 D3): flutter-action
      # puts flutter and dart on PATH. No toolchain-* target runs in CI.
      - name: Dependencies, format + analyze, tests
        run: make deps-dart check-dart test-dart FLUTTER=flutter DART=dart

      # Regenerates packages/fb_api_client from contracts/openapi.yaml (S02 D2)
      # and the app's l10n + Riverpod code in apps/mobile (S06 D14), and fails
      # if the worktree then differs from the commit. Runs after the tests on
      # purpose: it needs a clean worktree, and nothing above changes the
      # generated paths.
      - name: Generated Dart code (API client, app) is up to date
        run: make gen-check FLUTTER=flutter DART=dart

      - name: Traceability report (into the job summary)
        run: make trace FLUTTER=flutter DART=dart | tee -a "$GITHUB_STEP_SUMMARY"

  dotnet:
    name: dotnet
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No built-in `cache:`: it requires packages.lock.json, which we don't use
      # yet (S01 D6). The NuGet cache is the actions/cache step below.
      - name: Set up .NET (SDK from backend/global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props', 'backend/**/*.csproj', 'backend/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # setup-dotnet installs into DOTNET_ROOT (/usr/share/dotnet) and exports it.
      # Pass the same root to make, so `dotnet` and the MTP test apphosts use the
      # SDK that was just installed (S01 D3).
      - name: Restore, format + build (warnings as errors)
        run: |
          : "${DOTNET_ROOT:?setup-dotnet did not export DOTNET_ROOT}"
          make deps-dotnet check-dotnet DOTNET="$DOTNET_ROOT/dotnet" DOTNET_ROOT="$DOTNET_ROOT"

      # Rebuilds the Host (incremental after the build above, which already wrote
      # backend/artifacts/openapi/server.json) and diffs that document against
      # contracts/openapi.yaml with oasdiff. Docker is preinstalled on the runner;
      # compose pulls the digest-pinned oasdiff image on demand (S02 D8, D9).
      # The Makefile puts $DOTNET_ROOT first on PATH: the build runs plain `dotnet`.
      # Before the tests on purpose: a server-only change fails here with the
      # conformance message and one ::error annotation per difference.
      - name: API contract conformance (server document vs contract)
        run: make contract-conformance DOTNET="$DOTNET_ROOT/dotnet" DOTNET_ROOT="$DOTNET_ROOT"

      # Reuses the Release build above (no restore, incremental).
      - name: Tests
        run: make test-dotnet DOTNET="$DOTNET_ROOT/dotnet" DOTNET_ROOT="$DOTNET_ROOT"

  # Docker-only contract checks (S02 D13). Redocly, Spectral and oasdiff run as
  # digest-pinned, offline containers via tools/contract-tools/compose.yaml;
  # Docker Engine and Compose v2 come with the runner image. The Makefile exports
  # UID, GID and REPO_ROOT for compose. No Flutter or .NET here.
  contract:
    name: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Full history and tags: contract-breaking compares with the newest
      # contracts-v* tag, or before the first tag with the merge-base with
      # origin/main (S02 A1).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pull the pinned contract tool images
        run: make contract-tools

      - name: Bundle fresh, lint, self-test, breaking-change report
        run: make contract-bundle-check contract-lint contract-selftest contract-breaking

  # The one required status check. Fails unless every needed job succeeded:
  # failure, cancelled and skipped all fail the gate (nothing is skipped on
  # purpose while there is no path filtering).
  ci:
    name: ci
    if: always()
    needs: [dart, dotnet, contract]
    runs-on: ubuntu-24.04
    permissions: {} # reads only `needs`; no token scopes at all
    timeout-minutes: 5
    steps:
      - name: All jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key)\t\(.value.result)"' <<<"$NEEDS" | {
            failed=0 seen=0
            while IFS=$'\t' read -r job result; do
              printf '%-10s %s\n' "$job" "$result"
              seen=$((seen + 1))
              [[ "$result" == success ]] || failed=1
            done
            if (( failed || seen == 0 )); then
              echo "::error title=ci gate::at least one job did not succeed (see above)"
              exit 1
            fi
          }
