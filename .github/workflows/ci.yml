# Fitness Buddy CI: the one workflow and the one required check.
#
# Jobs `catalog`, `dart`, `dart-test`, `dotnet`, `eval`, `contract`, `image`,
# `android` and `android-it` run the same `make` targets as a laptop does. The API contract checks (`make
# check-contract`, TD-023) are spread over three jobs so that no toolchain is
# set up or built twice (S02 D13):
#   contract  bundle fresh, Spectral lint, self-test, breaking-change report
#             (Docker only, no Flutter or .NET)
#   dart      gen-check: the committed Dart client is what the generator produces
#   dotnet    contract-conformance: the Host's OpenAPI document matches the
#             contract (reuses the Release build of the job; runs before the
#             tests, so a server-only drift shows the conformance message
#             first, not a Contract.Tests failure)
# Every check runs exactly once. The gate job `ci` always runs and passes only if
# every job it `needs` succeeded; it is the only check the `main` ruleset requires
# (S01 A1). New gates (eval) are added as jobs here and to
# `ci.needs`, so the ruleset never changes.
#
# Fast CI (TD-086): a regular run aims at 5-10 minutes. The Dart tests run in
# parallel shards (`dart-test`), the AAB (all ABIs, only needed for Play) is
# built on main and nightly only, and the emulator job `android-it` runs
# nightly on main (schedule), on manual runs, and on a push whose head commit
# message contains `[it]` (milestone steps, Patrol or native changes). A red
# nightly is stop-the-line: fixed before the next merge.
# Every other job runs on every push, with one exception (TD-060, supersedes
# S01 A2): on step branches that change nothing the Android build can depend on
# (`changes` job), `android` is skipped, so a backend-only branch doesn't wait
# for it. main, merge/*, pull requests, schedule and manual runs always run it.
# Actions are pinned to full commit SHAs; Dependabot (github-actions) bumps them.
name: CI

on:
  push:
    branches: ['**', '!dependabot/**'] # Dependabot branches run via pull_request
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly full run on main (01:30 UTC), including the emulator job
    # `android-it` (TD-086); new NuGet advisories (NuGetAudit) and toolchain
    # drift also surface without a commit.
    - cron: '30 1 * * *'

permissions:
  contents: read

concurrency:
  # One run per branch or PR: a newer push cancels the older run. On main every
  # run gets its own group (run_id), so nothing there is cancelled or dropped.
  group: ci-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash # bash -eo pipefail

jobs:
  # Does this branch touch anything the Android jobs build or check? Compared
  # with its merge-base on main, so a branch that touched the app once keeps
  # running them. Any doubt (no merge-base, a full-run ref) means yes.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      android: ${{ steps.android.outputs.android }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Android-relevant changes?
        id: android
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          android=true
          if [[ "$EVENT" == push && "$REF" != refs/heads/main && "$REF" != refs/heads/merge/* ]] \
            && base="$(git merge-base origin/main HEAD 2>/dev/null)"; then
            relevant='^(apps/mobile/|packages/|contracts/|data/|tools/catalog/|pubspec\.(yaml|lock)$|analysis_options\.yaml$|\.fvmrc$|Makefile$|\.github/workflows/ci\.yml$|tools/scripts/(build-android|android-defines|setup-android|patrol-android|android-|session-|test_session_|apk_hardening|apk-hardening|testdata/apk-hardening/))'
            if ! git diff --name-only "$base" HEAD | grep -Eq "$relevant"; then
              android=false
            fi
          fi
          echo "android=$android" >>"$GITHUB_OUTPUT"
          echo "Android jobs run: $android" >>"$GITHUB_STEP_SUMMARY"

  # Food catalog (A05 D11): `make catalog-check` validates data/, checks the ID
  # lock against the merge base on origin/main (an ID may never change or
  # disappear), freshness of data/catalog_release.yaml, the contracts/catalog
  # schemas, the pack size budget and the AT-003 must-cover regression. Then
  # builds the release pack and uploads it with its manifest.
  catalog:
    name: catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Full history: the lock check compares with the merge base (CATALOG_BASE_REF
      # defaults to origin/main).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Flutter (version from .fvmrc)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
          pub-cache-key: 'flutter-pub-:os:-:version:-:arch:'

      - name: Dart dependencies
        run: make deps-dart FLUTTER=flutter DART=dart

      # Counts and the AT-003 table go to the job summary; the exit code is the
      # catalog tool's, not tee's (pipefail).
      - name: Catalog checks (validation, ID lock, freshness, schemas, size, AT-003)
        run: |
          make catalog-check FLUTTER=flutter DART=dart | tee "$RUNNER_TEMP/catalog-check.txt"
          {
            echo "### Food catalog"
            echo
            grep -E '^(catalog v|  )' "$RUNNER_TEMP/catalog-check.txt" | sed 's/^/- /; s/^-   /- /' || true
            echo
            grep -E '^\|' "$RUNNER_TEMP/catalog-check.txt" || true
            echo
            grep -E '^Must-cover' "$RUNNER_TEMP/catalog-check.txt" || true
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Build the release pack (no drafts)
        run: make catalog-pack FLUTTER=flutter DART=dart

      - name: Upload the pack and its manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-pack
          path: |
            apps/mobile/assets/catalog/catalog.db
            apps/mobile/assets/catalog/catalog_manifest.json
          retention-days: 30
          if-no-files-found: error

  dart:
    name: dart
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: check-dart's frozen-migrations check compares with
          # the merge base on origin/main (A01 D15).
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Flutter (version from .fvmrc)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
          # The action appends -<hashFiles('**/pubspec.lock')> to this key itself.
          pub-cache-key: 'flutter-pub-:os:-:version:-:arch:'

      # Tool paths are overridden on the command line (S01 D3): flutter-action
      # puts flutter and dart on PATH, so toolchain-flutter doesn't run in CI.
      # The tests run in the parallel `dart-test` job (TD-086).
      - name: Dependencies, format + analyze, app-check
        run: make deps-dart catalog-pack check-dart FLUTTER=flutter DART=dart

      - name: Sentry envelope sink self-test (A11 PR-11)
        run: PYTHONDONTWRITEBYTECODE=1 python3 -I -m unittest discover -s tools/scripts -p test_sentry_envelope_sink.py

      - name: Android build overrides, backup key and CI policy self-tests (A11 T16-T18)
        run: |
          bash tools/scripts/build-android-selftest.sh
          bash tools/scripts/verify-key-backup-selftest.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -I -m unittest discover -s tools/scripts -p test_android_ci.py

      # Regenerates packages/fb_api_client from contracts/openapi.yaml (S02 D2)
      # and the app's l10n + Riverpod code in apps/mobile (S06 D14), and fails
      # if the worktree then differs from the commit. Runs after the tests on
      # purpose: it needs a clean worktree, and nothing above changes the
      # generated paths.
      - name: Generated Dart code (API client, app) is up to date
        run: make gen-check FLUTTER=flutter DART=dart

      - name: Traceability report (into the job summary)
        run: make trace FLUTTER=flutter DART=dart | tee -a "$GITHUB_STEP_SUMMARY"

  # The Dart tests in parallel shards (TD-086): apps/mobile split in three by
  # flutter test's --shard-index (without `perf` tests), apps/mobile's `perf`
  # tests alone and one at a time (load-sensitive budgets), every other
  # workspace member in one. The same
  # script as `make test-dart` on a laptop; DART_TEST_SHARD picks the slice and
  # the 4-core runner gets 4 test workers.
  dart-test:
    name: dart-test (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['app:1/3', 'app:2/3', 'app:3/3', 'app:perf', 'packages']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tools/catalog's tests compare with the merge base on origin/main
          persist-credentials: false

      - name: Set up Flutter (version from .fvmrc)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
          pub-cache-key: 'flutter-pub-:os:-:version:-:arch:'

      - name: Dependencies and tests (${{ matrix.shard }})
        env:
          DART_TEST_SHARD: ${{ matrix.shard }}
          DART_TEST_JOBS: '4'
        run: make deps-dart catalog-pack test-dart FLUTTER=flutter DART=dart 2>&1 | tee "$RUNNER_TEMP/dart-tests.log"

      # Failing tests as annotations (readable through the API without a token).
      - name: Failed tests as annotations
        if: failure()
        run: |
          grep -E '❌|\[E\]$|^dart-test-all: error' "$RUNNER_TEMP/dart-tests.log" | sed 's/^::group:://' | head -n 40 |
            while IFS= read -r line; do echo "::error title=dart test::${line:0:300}"; done || true

  dotnet:
    name: dotnet
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No built-in `cache:`: it requires packages.lock.json, which we don't use
      # yet (S01 D6). The NuGet cache is the actions/cache step below.
      - name: Set up .NET (SDK from backend/global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props', 'backend/**/*.csproj', 'backend/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # setup-dotnet installs into DOTNET_ROOT (/usr/share/dotnet) and exports it.
      # Pass the same root to make, so `dotnet` and the MTP test apphosts use the
      # SDK that was just installed (S01 D3).
      - name: Restore, format + build (warnings as errors)
        run: |
          : "${DOTNET_ROOT:?setup-dotnet did not export DOTNET_ROOT}"
          make deps-dotnet check-dotnet DOTNET="$DOTNET_ROOT/dotnet" DOTNET_ROOT="$DOTNET_ROOT"

      # Rebuilds the Host (incremental after the build above, which already wrote
      # backend/artifacts/openapi/server.json) and diffs that document against
      # contracts/openapi.yaml with oasdiff. Docker is preinstalled on the runner;
      # compose pulls the digest-pinned oasdiff image on demand (S02 D8, D9).
      # The Makefile puts $DOTNET_ROOT first on PATH: the build runs plain `dotnet`.
      # Before the tests on purpose: a server-only change fails here with the
      # conformance message and one ::error annotation per difference.
      - name: API contract conformance (server document vs contract)
        run: make contract-conformance DOTNET="$DOTNET_ROOT/dotnet" DOTNET_ROOT="$DOTNET_ROOT"

      # B02's private .NET CLI + Dart parse graders; fixtures only, no API credential in CI.
      - name: Set up Flutter for the offline Buddy harness
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
          pub-cache-key: 'flutter-pub-:os:-:version:-:arch:'

      - name: Restore Dart catalog tool dependencies
        run: make deps-dart FLUTTER=flutter DART=dart

      # Reuses the Release build above. S04 Persistence.Tests starts one digest-pinned
      # Postgres Testcontainer; Docker is preinstalled, no hosted database/service credentials.
      - name: Tests, including offline public Buddy M3 eval (B08)
        run: |
          make test-dotnet DOTNET="$DOTNET_ROOT/dotnet" DOTNET_ROOT="$DOTNET_ROOT" FLUTTER=flutter DART=dart \
            2>&1 | tee "$RUNNER_TEMP/dotnet-tests.log"

      # Failing test names and their first assertion lines as annotations, which
      # the API serves without a token (log text needs one). Synthetic test data only.
      - name: Failed tests as annotations
        if: failure()
        run: |
          grep -A4 -E '^failed ' "$RUNNER_TEMP/dotnet-tests.log" | grep -v -E '^\s+at |^--$' | head -n 40 |
            while IFS= read -r line; do echo "::error title=dotnet test::${line:0:300}"; done || true

      - name: Offline Buddy SDK replay and parse grading (B02)
        run: make eval DOTNET="$DOTNET_ROOT/dotnet" DOTNET_ROOT="$DOTNET_ROOT" FLUTTER=flutter DART=dart

      - name: Upload offline Buddy endpoint report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: buddy-public-eval
          path: backend/artifacts/buddy/B08-offline.json
          if-no-files-found: error
          retention-days: 7

  # Reuse the real endpoint run from dotnet; no second build or paid provider call.
  eval:
    name: eval
    needs: dotnet
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download this run's offline report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --name buddy-public-eval --dir report
      - name: Gate M3 parse and resolution regressions (no key)
        run: python3 tools/scripts/check-buddy-eval.py report/B08-offline.json

  # The same hardened image; B01 also checks the Dart client against its real HTTP API.
  image:
    name: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and smoke-test the API image
        run: make image-smoke

      - name: Private laptop stack safety, isolation and restore (B03, synthetic only)
        env:
          PHONE_SERVER_SMOKE_IMAGE: fitness-buddy-api:smoke
        run: make phone-server-smoke

      - name: Set up Flutter for the sync harness (version from .fvmrc)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
          pub-cache-key: 'flutter-pub-:os:-:version:-:arch:'

      - name: Real sync convergence, faults and throughput (B01)
        env:
          SYNC_SPIKE_IMAGE: fitness-buddy-api:smoke
          SYNC_SPIKE_SKIP_BUILD: '1'
        run: make deps-dart sync-spike FLUTTER=flutter DART=dart

  # Docker-only contract checks (S02 D13). Redocly, Spectral and oasdiff run as
  # digest-pinned, offline containers via tools/contract-tools/compose.yaml;
  # Docker Engine and Compose v2 come with the runner image. The Makefile exports
  # UID, GID and REPO_ROOT for compose. No Flutter or .NET here.
  contract:
    name: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Full history and tags: contract-breaking compares with the newest
      # contracts-v* tag, or before the first tag with the merge-base with
      # origin/main (S02 A1).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pull the pinned contract tool images
        run: make contract-tools

      - name: Bundle fresh, lint, self-test, breaking-change report
        run: make contract-bundle-check contract-lint contract-selftest contract-breaking

  # The owner's Android build (S06 plan D3, D4, D7, A6, A8): `make build-android`
  # for the staging flavor, a release APK (arm64, for the phone) + an AAB (for
  # Play, A43), versionCode = the run number so each build installs over the
  # last. build-android.sh checks the APK (not debuggable, no cleartext) and the
  # signer: with the release key the certificate must be the pinned one.
  # Signing: 3 Actions secrets (docs/runbooks/android-signing.md §3); without
  # them (forks, Dependabot) a *-debugkey.* build and no upload. The signed APK is
  # uploaded unzipped (`archive: false`) for the owner to download on the phone.
  # The runner brings JDK 21 and an Android SDK; `toolchain-android-sdk` adds the
  # NDK and CMake versions the build needs. No debug build here: the dev-flavor
  # debug APK is what android-it builds (plan D7).
  android:
    name: android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Start time
        id: start
        run: echo "epoch=$(date +%s)" >>"$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Captured aapt2 dumps only (no SDK): fails in seconds, before the build.
      - name: APK hardening check self-test
        run: make apk-hardening-selftest

      - name: Set up Flutter (version from .fvmrc)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
          pub-cache-key: 'flutter-pub-:os:-:version:-:arch:'

      # The runner's preinstalled Temurin 21 (from its tool cache, no download).
      # setup-java exports JAVA_HOME; the Makefile's `JAVA_HOME ?=` takes it.
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK packages (NDK, CMake) into the runner's SDK
        run: make toolchain-android-sdk

      # The open-source cache provider; read-only off main (the action's
      # default), so only main writes the Gradle cache.
      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          add-job-summary: on-failure

      # apps/mobile/android/gradle.properties caps the heaps for the 7 GB laptop.
      # The Gradle user home's gradle.properties wins over it: the runner has 16 GB.
      - name: Gradle heap for the 16 GB runner
        run: |
          gradle_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_home"
          {
            echo 'org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError'
            echo 'kotlin.daemon.jvmargs=-Xmx2G'
          } >>"$gradle_home/gradle.properties"

      - name: Dart dependencies
        run: make deps-dart FLUTTER=flutter DART=dart

      # Writes the keystore only when the secret is set. The secret reaches the
      # shell through env (never interpolated into the script) and is never
      # printed; `signed` is the only thing later steps see.
      - name: Release key (only when the secrets are set)
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.FB_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "signed=false" >>"$GITHUB_OUTPUT"
            echo "No FB_ANDROID_KEYSTORE_BASE64 secret (fork, Dependabot, or not set up yet):"
            echo "debug-key build (*-debugkey.*), nothing is uploaded."
            exit 0
          fi
          keystore="$RUNNER_TEMP/fb-release.jks"
          if ! (umask 077 && base64 -d <<<"$KEYSTORE_BASE64" >"$keystore" 2>/dev/null); then
            rm -f -- "$keystore"
            echo "::error title=release key::FB_ANDROID_KEYSTORE_BASE64 is not valid base64 (docs/runbooks/android-signing.md §3)"
            exit 1
          fi
          { echo "signed=true"; echo "keystore=$keystore"; } >>"$GITHUB_OUTPUT"
          echo "Release keystore restored to \$RUNNER_TEMP."

      # FB_RELEASE_ENV= : never read a laptop key file. Without the secrets
      # FB_KEYSTORE_PATH is empty and build-android.sh signs with the debug key.
      # The alias isn't a secret (it's in the runbook): a secret would mask
      # "fitnessbuddy", and with it the application id, in every log.
      # `make build-android` first runs catalog-pack (the non-mutating release
      # pack into the app assets, A05 D7), and build-android.sh refuses a pack
      # with drafts (D8).
      - name: Select the release flavor (A11 D14)
        id: flavor
        run: |
          flavor=staging
          if [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/heads/merge/* ]]; then
            flavor=prod
          fi
          echo "name=$flavor" >>"$GITHUB_OUTPUT"

      # The AAB (every ABI, for Play) only on main, nightly and manual runs
      # (TD-086); step and merge branches build the arm64 APK the checks need.
      - name: Build the selected release APK (arm64), + AAB on main and nightly
        env:
          FB_BUILD_AAB: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
          FLAVOR: ${{ steps.flavor.outputs.name }}
          FB_API_BASE_URL: ${{ secrets.FB_API_BASE_URL }}
          FB_SENTRY_DSN: ${{ secrets.FB_SENTRY_DSN }}
          FB_KEYSTORE_PATH: ${{ steps.key.outputs.keystore }}
          FB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FB_ANDROID_KEYSTORE_PASSWORD }}
          FB_ANDROID_KEY_ALIAS: fitnessbuddy
          FB_ANDROID_KEY_PASSWORD: ${{ secrets.FB_ANDROID_KEY_PASSWORD }}
        run: |
          make build-android FLAVOR="$FLAVOR" BUILD_NUMBER="$GITHUB_RUN_NUMBER" FB_RELEASE_ENV= \
            FLUTTER=flutter DART=dart

      - name: A20 release session safety on the built APK
        run: |
          python3 -m unittest discover -s tools/scripts -p test_session_release_check.py
          build_tools="$(sed -n 's/^build-tools;\([^|]*\)|.*/\1/p' tools/scripts/android-sdk-packages.txt)"
          for apk in apps/mobile/build/app/outputs/flutter-apk/app-*-release*.apk; do
            python3 tools/scripts/session-release-check.py \
              --aapt2 "$ANDROID_HOME/build-tools/$build_tools/aapt2" "$apk"
          done

      - name: Delete the release keystore
        if: always()
        run: rm -f -- "$RUNNER_TEMP/fb-release.jks"

      # Flutter's build above creates android/local.properties for Gradle.
      - name: Android host unit tests
        run: make test-android-unit FLUTTER=flutter DART=dart

      # Only a build signed with the release key reaches the owner: build-android
      # failed above if the certificate wasn't the pinned one, and a debug-key
      # build is named *-debugkey.apk, which this exact path never matches.
      - name: Upload the signed staging APK (unzipped, 30 days)
        if: steps.key.outputs.signed == 'true' && steps.flavor.outputs.name == 'staging'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: apps/mobile/build/app/outputs/flutter-apk/app-staging-release.apk
          archive: false
          retention-days: 30
          if-no-files-found: error

      - name: Upload the signed prod APK (unzipped, 30 days)
        if: steps.key.outputs.signed == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: apps/mobile/build/app/outputs/flutter-apk/app-prod-release.apk
          archive: false
          retention-days: 30
          if-no-files-found: error

      - name: Job summary (signing, outputs, time)
        if: always()
        env:
          FLAVOR: ${{ steps.flavor.outputs.name }}
          SIGNED: ${{ steps.key.outputs.signed }}
          START: ${{ steps.start.outputs.epoch }}
        run: |
          outputs=apps/mobile/build/app/outputs
          {
            echo "### Android $FLAVOR build (run ${GITHUB_RUN_NUMBER})"
            if [[ "$SIGNED" == true ]]; then
              echo "- Signing: **release key** (pinned certificate); artifact uploads on main (prod) or staging runs"
              pin="$(sed -n 's/^readonly RELEASE_CERT_SHA256="\([a-f0-9]*\)"$/\1/p' tools/scripts/build-android.sh)"
              echo "- Signer certificate SHA-256: \`$pin\`"
            else
              echo "- Signing: **debug key** (no release-key secrets in this run); nothing uploaded"
            fi
            shopt -s nullglob
            for f in "$outputs"/flutter-apk/app-"$FLAVOR"-release*.apk "$outputs"/bundle/"${FLAVOR}Release"/*.aab; do
              echo "- \`${f##*/}\` $(du -h "$f" | cut -f1), sha256 \`$(sha256sum "$f" | cut -d' ' -f1)\`"
            done
            echo "- Job time: $(( $(date +%s) - START )) s"
            echo "- Disk free: $(df -h --output=avail / | tail -n 1 | tr -d ' ')"
          } >>"$GITHUB_STEP_SUMMARY"
          # Also as an annotation: readable through the API without a login.
          apk="$outputs/flutter-apk/app-$FLAVOR-release.apk"
          eligible=false
          if [[ "$SIGNED" == true && -f "$apk" && ( "$FLAVOR" == staging || "$GITHUB_REF" == refs/heads/main ) ]]; then
            eligible=true
          fi
          echo "::notice title=android signing::signed=${SIGNED:-false}; upload-eligible=$eligible; ${apk##*/}"
          if [[ -f "$apk" ]]; then
            echo "::notice title=android output::sha256 $(sha256sum "$apk" | cut -d' ' -f1)"
          fi

  # Integration tests (S06 plan D18, A7): `make test-it` runs the Patrol tests in
  # apps/mobile/patrol_test/ (dev flavor, debug) on an API 34 emulator. Nothing
  # serves the dev API on the emulator, so they also prove the app starts and
  # works offline. Needs KVM: the job checks /dev/kvm first and fails readably
  # without it. At most one automatic retry of the emulator run (A7), shown as a
  # warning and in the job summary; a second failure fails the job.
  android-it:
    name: android-it
    # Nightly, manual, or on request with `[it]` in the head commit message
    # (TD-086); the gate below treats a skipped android-it as passed.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[it]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
    steps:
      - name: Start time
        id: start
        run: echo "epoch=$(date +%s)" >>"$GITHUB_OUTPUT"

      - name: KVM present?
        run: |
          if [[ -e /dev/kvm ]]; then
            ls -l /dev/kvm
            echo "- /dev/kvm: present (\`$(ls -l /dev/kvm)\`)" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "- /dev/kvm: **missing**" >>"$GITHUB_STEP_SUMMARY"
            echo "::error title=KVM::/dev/kvm is missing on this runner: the emulator can't run (S06 plan A7: ask the owner)"
            exit 1
          fi

      # The emulator-runner README's step: the runner user gets access to /dev/kvm.
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter (version from .fvmrc)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
          pub-cache-key: 'flutter-pub-:os:-:version:-:arch:'

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK packages (NDK, CMake) into the runner's SDK
        run: make toolchain-android-sdk

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          add-job-summary: on-failure

      - name: Gradle heap for the 16 GB runner
        run: |
          gradle_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_home"
          {
            echo 'org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError'
            echo 'kotlin.daemon.jvmargs=-Xmx2G'
          } >>"$gradle_home/gradle.properties"

      - name: Dart dependencies
        run: make deps-dart FLUTTER=flutter DART=dart

      # `make build-it` and `make test-it` depend on catalog-pack: the bundled
      # pack (A05 D7) is built before Gradle. Compiles before the emulator
      # starts, so the emulator never waits on a cold Gradle build; `make
      # test-it` below then only rebuilds what changed.
      - name: Build the test APKs (dev debug app + instrumentation)
        run: make build-it FLUTTER=flutter DART=dart

      - name: Cache the AVD
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-api34-google_apis-x86_64-v1

      # Cache miss only: boot once and save a snapshot, so later runs boot from it.
      - name: Create the AVD and its snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "AVD and snapshot created for the cache."

      # Each `script` line runs on its own (sh -c): one line only. The output is
      # also kept in $RUNNER_TEMP for the summary (the test result lines).
      - name: Patrol tests on the emulator
        id: it1
        continue-on-error: true
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: bash -o pipefail -c 'make test-it FLUTTER=flutter DART=dart 2>&1 | tee "$RUNNER_TEMP/patrol-attempt-1.log"'

      # Failure details as check-run annotations (readable without a token).
      - name: Failure details as annotations (attempt 1, before the retry overwrites them)
        if: always() && steps.it1.outcome == 'failure'
        run: python3 tools/scripts/patrol-annotations.py

      - name: Patrol tests on the emulator (the one automatic retry, plan A7)
        id: it2
        if: steps.it1.outcome == 'failure'
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: bash -o pipefail -c 'make test-it FLUTTER=flutter DART=dart 2>&1 | tee "$RUNNER_TEMP/patrol-attempt-2.log"'

      - name: Failure details as annotations (attempt 2)
        if: always() && steps.it2.outcome == 'failure'
        run: python3 tools/scripts/patrol-annotations.py

      # Separate synthetic entrypoint, after Patrol so its APK cannot replace the
      # instrumentation target. One incremental debug build; no catalog rebuild.
      - name: Build A20 dev debug durability probe
        timeout-minutes: 4
        working-directory: apps/mobile
        run: flutter build apk --debug --flavor dev --target-platform android-x64 --target tool/session_durability_probe.dart --dart-define-from-file=config/dev.json

      - name: A20 native restart and process kill evidence
        timeout-minutes: 8
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: bash -o pipefail -c 'adb install -r apps/mobile/build/app/outputs/flutter-apk/app-dev-debug.apk && timeout 420s python3 -u tools/scripts/session-native-evidence.py || { echo "::error title=A20 native evidence::probe install or harness failed or exceeded seven minutes"; exit 1; }'

      - name: Job summary (attempts, time)
        if: always()
        env:
          IT1: ${{ steps.it1.outcome }}
          IT2: ${{ steps.it2.outcome }}
          AVD_HIT: ${{ steps.avd-cache.outputs.cache-hit }}
          START: ${{ steps.start.outputs.epoch }}
        run: |
          if [[ "$IT1" == failure ]]; then
            echo "::warning title=android-it retry::the first emulator run failed; retried once (plan A7): ${IT2:-not run}"
          fi
          # Patrol's per-test and total lines, without colour codes (the last
          # lines of the output if none match).
          results() {
            [[ -f "$1" ]] || return 0
            local clean
            clean="$(sed 's/\x1b\[[0-9;]*[A-Za-z]//g' "$1")"
            grep -E '[A-Z]{2,3}-[0-9]{3}|Total:|Successful:|Failed:|Skipped:|Duration:' <<<"$clean" \
              || tail -n 15 <<<"$clean"
          }
          {
            echo "### Android integration tests (Patrol, API 34 google_apis x86_64)"
            echo "- AVD cache: $([[ "$AVD_HIT" == true ]] && echo hit || echo 'miss (AVD + snapshot created)')"
            echo "- Attempt 1: ${IT1:-not run}"
            if [[ "$IT1" == failure ]]; then
              echo "- **Attempt 2 (automatic retry, plan A7): ${IT2:-not run}**"
            fi
            echo "- Job time: $(( $(date +%s) - START )) s"
            echo "- Disk free: $(df -h --output=avail / | tail -n 1 | tr -d ' ')"
            for n in 1 2; do
              lines="$(results "$RUNNER_TEMP/patrol-attempt-$n.log")"
              [[ -n "$lines" ]] || continue
              fence='```'
              printf '\nAttempt %s:\n%s\n%s\n%s\n' "$n" "$fence" "$lines" "$fence"
            done
          } >>"$GITHUB_STEP_SUMMARY"
          # Also as annotations: readable through the API without a login.
          for n in 1 2; do
            lines="$(results "$RUNNER_TEMP/patrol-attempt-$n.log")"
            [[ -n "$lines" ]] || continue
            lines="${lines//'%'/'%25'}"
            echo "::notice title=Patrol attempt $n::${lines//$'\n'/'%0A'}"
          done

  # The one required status check. Fails unless every needed job succeeded.
  # The only allowed skip: android/android-it when `changes` says the branch
  # doesn't touch Android (TD-060). Any other failure, cancel or skip fails it.
  ci:
    name: ci
    if: always()
    needs: [changes, catalog, dart, dart-test, dotnet, eval, contract, image, android, android-it]
    runs-on: ubuntu-24.04
    permissions: {} # reads only `needs`; no token scopes at all
    timeout-minutes: 5
    steps:
      - name: All jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          ANDROID: ${{ needs.changes.outputs.android }}
        run: |
          jq -r 'to_entries[] | "\(.key)\t\(.value.result)"' <<<"$NEEDS" | {
            failed=0 seen=0
            while IFS=$'\t' read -r job result; do
              printf '%-10s %s\n' "$job" "$result"
              seen=$((seen + 1))
              if [[ "$result" == skipped && "$ANDROID" == false && "$job" == android ]]; then
                continue
              fi
              # Runs only nightly, manually or on `[it]` (TD-086); when it runs it must pass.
              if [[ "$result" == skipped && "$job" == android-it ]]; then
                continue
              fi
              [[ "$result" == success ]] || failed=1
            done
            if (( failed || seen == 0 )); then
              echo "::error title=ci gate::at least one job did not succeed (see above)"
              exit 1
            fi
          }
