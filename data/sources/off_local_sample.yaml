# A03 D12: ~30 products well known in West Bank / Jordan shops. Used only by
# tools/scripts/off_coverage.py to ask "does Open Food Facts know this product,
# and with complete data?". Names and brands only: no OFF data, no barcodes
# (no non-OFF barcode source was used). Format is a restricted YAML subset so the
# stdlib-only script can parse it: one "- id:" item per product, scalar fields,
# and inline lists [a, b].
#   brand_any: substrings, any of which must occur in an OFF brands_tags value
#   name_any:  lowercase words, any of which must occur in the product name
#   source:    shop or brand page showing the product is sold locally
#   verified:  true = page seen while writing this file; false = brand's
#              well-known site, not opened (the owner can spot-check)
# Region: PS = Palestine, JO = Jordan, TR = Turkey, INT = international line sold locally.
