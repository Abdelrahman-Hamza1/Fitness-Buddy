# Curated USDA basics (A03 spike, grown in A04). Each entry picks one FDC food; the
# importer (`catalog import-usda`) copies its nutrients into data/usda/extract.jsonl.
# The dataset (SR Legacy or Foundation) follows from the FDC ID (A03 D1).
# `fiber_zero: true`: USDA omits fiber for this food, store 0 (A03 D3).
# `servings`: one unit amount, in grams, from the FDC portion list of the same food.
# Names: first `en` is the display name; AR and Arabizi are aliases people search with.
# Known USDA gaps (no entry, see data/reference_dishes/): sumac, freekeh, taboon,
# local cheeses (Nabulsi, Akkawi, baladi, halloumi), labaneh, zaatar mix, shrak.
foods:
  - id: usda:rice_white_long_grain_raw
    fdc_id: 168877
    state: dry
    yield_group: rice
    names:
      en: ["Rice, white, raw", "Basmati rice, raw", "Rice, raw"]
      ar: ["رز أبيض", "رز", "رز بسمتي"]
      arabizi: ["ruz abyad", "riz", "ruz", "roz", "ruz basmati", "basmati"]
    servings: [{unit: cup, g: 185}]
    notes: "USDA has no basmati; long-grain white rice is used for basmati (similar per 100 g)."
