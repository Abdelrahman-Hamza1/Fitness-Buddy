  notes: >-
    One piece (130 g) is the pot of 6 home-sized flatbreads (about 14 cm); a bakery manousheh is bigger (large_piece
    190 g) and folded or rolled with cheese or vegetables inside the sandwich. The dough water is not an ingredient
    row (it only sets the cooked weight: about 55% of the flour, with about 10% lost as steam on baking, modelled, not
    weighed). Oil is the biggest uncertainty: the dough has 9 g per piece and the zaatar-oil topping 17 g per piece
    here, and bakery pieces are often oilier (a piece can be 100-150 kcal higher). Cucumber, tomato and mint sold
    with it are not included. Yeast is modelled with the compressed baker's yeast entry (usda:yeast_bakers) at the dry-yeast weight in the recipe; dry yeast is about 3 times denser, so energy is understated by under 15 kcal per pot (below 0.5%). AI verification 2026-10-30 (A17/A18 number check, D-087): every variant independently recalculated from the catalog ingredients by a second agent; plate and range judged plausible, and the review findings (aliases, provenance, notes) were fixed.
