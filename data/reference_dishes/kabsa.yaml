  notes: >-
    Only one gram-based recipe was read (other kabsa pages were reached by search only and agree on the pattern: rice,
    chicken, tomato, carrot, raisins, almonds); Gulf kabsa is also made with whole chicken or lamb, and Palestinian
    families often make the lighter spiced chicken rice (see ref:chicken_and_rice). The pot is about 4.6 plates (380 g);
    the cooked weight is an explicit balance, not weighed: ingredient rows 1.78 kg plus 1 litre of water is 2.78 kg in the pot; the rice absorbs only about 0.5 kg of water (1.5 cups of rice need about 2 cups) and the vegetables release their own water, so about 1.0 kg (37%) boils off or is left unserved, giving about 1.75 kg (range 1.55-1.95 kg).
    Oil is the biggest uncertainty (some cooks fry the chicken first in ghee, which adds fat). Restaurant kabsa and
    lamb kabsa are not covered; sauce (daqqus) and salad are not included. AI verification 2026-10-30 (A17/A18 number check, D-087): every variant independently recalculated from the catalog ingredients by a second agent; plate and range judged plausible, and the review findings (aliases, provenance, notes) were fixed.
