review:
  status: draft
  reviewed_by: claude-draft
  sources:
  - "Alphafoodie, Homemade Tomato Sauce; fetched recipe card; base tomato/garlic/oil/basil sauce, adapted to 1 kg tomatoes: https://www.alphafoodie.com/homemade-roasted-tomato-sauce/"
  - "USDA FoodData Central: ingredient nutrients from this repository data/usda/extract.jsonl; local reference ingredients cite their own labels."
  - "British Heart Foundation, Spaghetti Bolognese, six servings; 500 g extra-lean mince / 400 g dried spaghetti, covered simmer: https://www.bhf.org.uk/informationsupport/support/healthy-living/healthy-eating/recipe-finder/spaghetti-bolognese"
  - "Foodbank SA, Spaghetti Bolognese, four servings; 500 g mince / 500 g pasta, five-minute covered sauce: https://www.foodbank.org.au/wp-content/uploads/2021/06/Meal-Pack-Spaghetti-Bolognese-FINAL-2021.pdf"
  - "Nestle NZ, Spaghetti Bolognese; complete ratio but lentil method ambiguity: https://www.nestle.co.nz/nutrition/cook-for-life/recipes/spaghetti-bolognese"
  notes: >-
    Fix round 2026-10-30: NOT SUPPORTED FOR RELEASE; keep both variants draft. Original Alphafoodie
    citation supports sauce only. Its roasted-method yield (about 1.25 cups per pound tomatoes) does not
    establish the current 870 g sauce/kg tomatoes; stovetop reduction differs. Both old recipes and
    cooked totals remain diagnostic placeholders, not validated nutrition. Whole-meal sources were
    found: British Heart Foundation gives 500 g extra-lean raw mince plus 400 g dry spaghetti for six
    servings, covered simmer for one hour, with an optional uncovered reduction and extra stock in place
    of wine. Foodbank gives 500 g mince plus 500 g dry spaghetti for four, a covered five-minute sauce
    with lentils and 800 g canned tomatoes. These support specific whole-meal ratios, but neither
    specifies finished grams; neither validates the old 400 g raw mince / 500 g pasta ratio, 75% drained
    mince yield, fresh-tomato sauce or its concentration. Nestle supplies another complete pasta/mince
    recipe but lists lentils without a step adding them; not chosen. No sources found that support a
    complete replacement concentration honestly. Do not select an arbitrary steam loss to make a 350 g
    plate fit. A rework must pick ONE whole-meal method, account for retained juices or discarded fat
    and obtain its cooked pot weight. Existing 1200 g pasta row uses catalog 2.4x hydration (500 g dry);
    that factor is not evidence for the selected sauce ratio. Existing totals (2070 g tomato, 2450 g
    meat) and plate/small_plate remain conditional; no cheese, cream or finishing oil.
