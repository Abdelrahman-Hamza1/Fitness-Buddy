review:
  status: draft
  reviewed_by: claude-draft
  sources:
  - 'Amina, Hungry Paprikas, Qatayef; fetched card: 240 g flour, 55 g semolina, 25 g sugar, 2.5 cups water, 30 pieces,
    half walnut and half 300 g cheese filling; double either for a single filling, 400 g sugar syrup batch: https://www.hungrypaprikas.com/qatayef/'
  - 'Falasteeni Foodie, Qatayef; fetched card uses 1.5 cups flour and 1 cup semolina, more semolina than Hungry
    Paprikas; frying or brushing/baking: https://falasteenifoodie.com/qatayef-recipe/'
  - 'USDA FoodData Central: ingredient nutrients from this repository data/usda/extract.jsonl; local reference ingredients
    cite their own labels.'
  - "Al-Ismail et al. (2021), Trans fatty acids content of sweets and appetisers traditionally consumed in Jordan, Table I: https://www.innovhub-ssi.it/kdocs/2012987/2021_vol._982_-_art._06_-_al-ismail.pdf"
  notes: >-
    Fix round 2026-10-30: NOT SUPPORTED FOR RELEASE; keep draft. Hungry Paprikas explicitly makes 15
    walnut and 15 cheese pancakes: a 30-piece single-filling batch doubles walnuts to 360 g [300,440],
    cinnamon to 10 g and honey to 126 g, or Akkawi to 600 g [500,800]. The 30-piece yield is sourced;
    finished mass is not. To correct the existing draft consistently without pretending to measure
    yield, carry forward its UNVERIFIED steam losses (282.5 g walnut; 264.5 g cheese): walnut_fried
    1830.5 - 282.5 = 1548 g; walnut_baked 1770.5 - 282.5 = 1488 g; cheese_fried 1934.5 - 264.5 = 1670 g;
    cheese_baked 1874.5 - 264.5 = 1610 g. Batch bounds add the extra filling low/high masses to the old
    draft bounds: walnut +218/+288 g; cheese +250/+400 g. Piece masses and bounds divide batch masses by
    30, rounded to 0.01 g; two_pieces doubles those displayed masses and bounds. These are conditional
    arithmetic bounds at 30 equal pieces, not measured piece-size variability. The original 200 g syrup
    sugar, 120 g syrup water and 90/30 g frying/brushing oil remain UNSUPPORTED placeholders; no new
    retained quantities invented. Al-Ismail et al. Table I specifies 25 g cheese or 46 g walnut syrup
    for a DIFFERENT 325 g dough preparation and leaves frying oil unquantified; scaling it onto this
    batter would not validate retention or yield. The 2023 Egyptian dessert absorption study does not
    report qatayef. A batch weighing before/after frying and dipping, or a matching published
    preparation with retained masses, is still required. Akkawi is a desalted brined-label nutrient
    proxy; dry yeast uses compressed yeast nutrients as previously disclosed. Baking powder omitted from
    nutrient rows. No review promotion.
