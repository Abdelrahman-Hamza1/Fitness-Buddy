review:
  status: draft
  reviewed_by: claude-draft
  sources:
    - "cooked.wiki, Traditional Crispy and Fluffy Palestinian Falafel (1 cup dry chickpeas, herbs, onion, garlic, spices, tahini sauce, garnish): https://cooked.wiki/saved/2e283df1-46af-49bb-a735-c7534ab75e22"
    - "Once Upon a Chef, Falafel (2 cups dry chickpeas make 20-24 falafel; oil absorption note): https://www.onceuponachef.com/recipes/falafel.html"
    - "Gulf News, Palestinian chicken musakhan (4 taboon breads = 330 g, used for the bread weight): https://gulfnews.com/food/cooking-cuisines/palestinian-chicken-musakhan-1.1621941750675"
    - "Cross-check only: USDA FoodData Central SR Legacy 172455, Falafel, home-prepared (333 kcal, 13.3 g protein, 31.8 g carbs, 17.8 g fat per 100 g; one 17 g patty)"
    - "USDA FoodData Central (SR Legacy) for every ingredient"
  notes: >-
    The recipe is for 4 sandwiches (20 balls of about 22 g, 5 per sandwich, that is about 107 g of falafel
    each). The two cited recipes give no ball weight or total oil; 22 g per ball (a falafel mould) is our
    assumption and 11 balls per cup of dry chickpeas would make them about twice as big, which changes the
    count but not the grams. Absorbed frying oil (55 g, range 30-80) is the biggest uncertainty; it is anchored by
    the USDA home-prepared falafel at 17.8 g fat per 100 g (the balls variant comes out close). Fillings are tahini
    sauce, tomato, pickles and lettuce; shop sandwiches with fries, hummus or extra tahini are heavier. The cooked
    weight includes about 60 g of water in the tahini sauce. The balls variant has its own piece and plate portions.
time_min: 20
