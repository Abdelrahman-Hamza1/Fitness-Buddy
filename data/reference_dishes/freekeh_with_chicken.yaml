  notes: >-
    The sources disagree on the grain (cracked in The Matbakh, whole in some others) and the extras (peas, mince, two kinds
    of nuts). The default follows The Matbakh (about 5 plates); the with_lamb_mince variant follows SBS (about 7 plates).
    Cooked weight is modelled from the freekeh yield (dry x 3.0, itself on the owner's skim list) plus the cooked chicken,
    not weighed: if your freekeh absorbs less broth, the 100 g energy will be higher. Chicken is skin-on and its fat is
    counted in full (the broth fat is not, because the freekeh takes only about 3 cups). Ghee is the biggest variable. Salad and
    yogurt on the side are not included. AI verification 2026-10-30 (A17/A18 number check, D-087): every variant independently recalculated from the catalog ingredients by a second agent; plate and range judged plausible, and the review findings (aliases, provenance, notes) were fixed.
