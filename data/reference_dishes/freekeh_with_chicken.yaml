  sources:
    - "The Matbakh, Chicken freekeh pilaf, family recipe (serves 5: 2.25 lb bone-in chicken, 1.5 cups freekeh, 1 cup peas, 4 tbsp ghee, 1/3 cup nuts): https://thematbakh.com/freekeh-recipe-with-chicken-family-recipe/"
