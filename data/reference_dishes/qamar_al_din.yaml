    water; drink adds 720 g water + 67 g sugar -> 1187 g pitcher. Recipe rows combine water as 665 g and sum to
    1187 g, no further evaporation. Added sugar about 25 g per 250 g glass plus intrinsic apricot sugars. Diluted
    variant retains same nutrients in 1583 g. Commercial sweetened leather compositions may differ substantially;
    labelled pack should replace homemade model. Cooked weights and household portion ranges are modelled, not measured;
