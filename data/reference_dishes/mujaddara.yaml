review:
  status: reviewed
  reviewed_by: ai-verified
  sources:
    - "Mai Storied Recipe, Mujadarah safra, Palestinian lentils and rice (serves 8: 3 cups red lentils, 1.5 cups rice, 3 tbsp plus 1/2 cup olive oil, 4 large onions): https://thestoriedrecipe.com/mujadarah-safra/print/40676/"
    - "Herbivoracious, Mujadara (3 lb onions, 1/4 cup oil, 3 cups cooked brown or green lentils, 6 cups cooked rice): https://herbivoracious.com/2011/07/mujadara-middle-eastern-rice-and-lentil-pilaf-recipe/"
    - "USDA FoodData Central (SR Legacy) for every ingredient"
  notes: >-
    The two sources differ on the grain-to-lentil ratio (Mai: 1 part rice to 2 of lentils, red lentils; Herbivoracious: 2 parts
    rice to 1 of lentils); the default uses equal dry weights, which is the usual home pot. The pot is about 6 plates
    (350 g). The oil is the biggest uncertainty: the onions are fried in 60-160 g and the oil that stays in the pot is
    counted, but some cooks drain the fried onions and keep the oil. The onions lose 70-80% of their weight when browned
    (modelled in the cooked weight, not weighed); the cooked weight (1.75 kg) is modelled from the dry lentils and
    rice absorbing water at about 3:1 and 2.8:1. Yogurt and salad at the side are not included. The `ladle` is one
    serving spoon (about 120 g), not a plate. AI verification 2026-10-30 (A17/A18 number check, D-087): every variant independently recalculated from the catalog ingredients by a second agent; plate and range judged plausible, and the review findings (aliases, provenance, notes) were fixed.
