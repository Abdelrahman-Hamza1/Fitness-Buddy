  notes: >-
    Rebuilt after the number check (2026-10-30). Serves 6-10 in the source; the pot is taken as 8 bowls of about 510 g (bowl
    450 g, a large stew bowl). Cooked weight is an explicit water balance, not a weighed yield: ingredient rows 2.68 kg
    plus the water that stays in the pot (1 litre for the stew and about 90% of the 720 ml of boiling sumac water, strained and added back, so about 1.65 kg)
    is 4.33 kg; the initial 120 ml of water evaporates during browning and is not counted; the meat, chard and chickpeas release their water into the stew and nothing else
    leaves it except steam (about 0.2 kg lost over a covered 1.5-hour simmer, assumed) and the strained sumac residue (about 30 g). That gives about 4.1 kg
    (range 3.7-4.4 kg), 142 kcal per 100 g. Only half the sumac (25 of 50 g) is counted since the solids are strained out. Oil (about 110 g, 14 g per
    bowl) and the lamb fat are the biggest uncertainties; Gazan versions often use beef, oxtail or no meat at all (a lighter
    pot) and some families use red tahini. Dill seed is modelled with caraway. Pita and rice at the side are not included.
    A thicker stew (more evaporation) weighs less per bowl and is richer per 100 g. AI verification 2026-10-30 (A17/A18 number check, D-087): every variant independently recalculated from the catalog ingredients by a second agent; plate and range judged plausible, and the review findings (aliases, provenance, notes) were fixed.
