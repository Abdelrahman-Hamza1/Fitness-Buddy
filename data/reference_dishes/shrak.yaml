  notes: >-
    Shrak (markook) is a very thin bread stretched over a saj (domed griddle). One piece is one large sheet (about 811 g
    dough in 6 pieces is 135 g raw, less about 10% on the saj, so 110-120 g); another recipe uses 80 g dough balls, so a
    sheet can be as small as 60-70 g. The sheets are also folded into quarters, which is the half/piece confusion to
    watch. Water only sets the cooked weight. The same bread under the mansaf platter is counted in ref:mansaf. This is
    the plain home bread, not the whole wheat or yeasted pita-style versions that some blogs call shrak. AI verification 2026-10-30 (A17/A18 number check, D-087): every variant independently recalculated from the catalog ingredients by a second agent; plate and range judged plausible, and the review findings (aliases, provenance, notes) were fixed.
