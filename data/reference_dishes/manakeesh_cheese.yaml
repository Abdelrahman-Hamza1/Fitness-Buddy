  notes: >-
    Dough is the same as for zaatar manakeesh (6 home pieces); the sources differ widely on cheese (23-54 g per piece), so
    37 g per piece is a midpoint and the range is large. The Matbakh's dough is much richer (egg, milk, 1/2 cup oil), which
    would add about 40 kcal per piece. A bakery cheese manousheh is bigger and cheesier (large_piece 200 g, often 300-400 kcal
    more than a home piece). The dough water only sets the cooked weight (modelled). Cheese sold as akkawi is often
    a blend; vegetables and mint on the side are not included. Yeast is modelled with the compressed baker's yeast entry (usda:yeast_bakers) at the dry-yeast weight in the recipe; dry yeast is about 3 times denser, so energy is understated by under 15 kcal per pot (below 0.5%). AI verification 2026-10-30 (A17/A18 number check, D-087): every variant independently recalculated from the catalog ingredients by a second agent; plate and range judged plausible, and the review findings (aliases, provenance, notes) were fixed.
