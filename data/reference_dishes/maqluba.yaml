  small_plate: {g: 280, range: [230, 330]}
  large_plate: {g: 500, range: [430, 620]}
review:
  status: draft
  reviewed_by: claude-draft
  sources:
    - "Christian Peacemaker Teams (CPT), Recipes from our PalestineTeam, Maqluba with Chicken (serves 6-8): https://cpt.org/suppers/recipes-from-palestine"
    - "Dumplings and More, Maqluba / Maklouba (500 g rice, 4 chicken thighs, 1 cauliflower, 2 eggplants, 2 potatoes, serves 8): https://dumplingsandmore.fr/?p=53209"
    - "USDA FoodData Central (SR Legacy and Foundation) for every ingredient"
  notes: >-
    Recipe lists differ on the vegetables (CPT: one eggplant OR cauliflower plus potato and carrot; Dumplings and More:
    cauliflower, 2 eggplants and 2 potatoes). The default is a mixed pot (eggplant and cauliflower, as many Palestinian
    families do); the other two variants use one main vegetable. Oil is the biggest uncertainty: the sources only say
    to shallow fry the vegetables 0.5-1 cm deep and give no total, so 90-140 g retained in the pot is our assumption
    (range 55-200 g). All weights are edible (no bones); the pot's cooked weight (2.35 kg) and the plate sizes are
    modelled (pot divided by 6-8 servings, CPT), not weighed. Chicken is skin-on thigh and its fat stays in the broth
    that cooks the rice, so a skimmed or skinless version will be lighter. Restaurant and lamb maqluba are not covered.
time_min: 20
