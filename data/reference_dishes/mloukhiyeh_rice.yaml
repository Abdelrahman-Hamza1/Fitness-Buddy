    - "Handmade Palestine, Molokhiya recipe, a taste of Palestine's summer tradition (frozen leaves, chicken broth, garlic in olive oil, served over rice; no rice or serving amounts): https://handmadepalestine.com/blogs/news/molokhiya-recipe-a-taste-of-palestine-s-summer-tradition"
