  notes: >-
    Quantities are from Falasteeni Foodie (serves 5); plate = pot divided by 4-5 servings with a little extra for
    a hungry plate. Handmade Palestine gives no usable quantities and uses frozen leaves; its salsa is not
    included. The cooked pot weight (1.6 kg: about 0.85 kg stew and 0.75 kg rice) is modelled from the 2 cups of
    water for the stew and the rice's absorption, not weighed. Palestinian mloukhiyeh is the soupy kind, so a
    plate is rice with stew poured over. Oil (garlic and vermicelli, 54 g in total) is the biggest uncertainty;
    family pots often use more, and with whole skin-on chicken pieces and fat in the broth. Lemon juice and bread
    on the side are not included. The stew_only variant has bowl and ladle portions (a ladle is about 1/2 cup). AI verification 2026-10-30 (A17/A18 number check, D-087): every variant independently recalculated from the catalog ingredients by a second agent; plate and range judged plausible, and the review findings (aliases, provenance, notes) were fixed.
