    - "USDA FoodData Central (SR Legacy) for every ingredient"
  notes: >-
    Sizes disagree by a factor of 2: the Smithsonian dough gives about 160 g per baked bread (6 from 500 g flour), Palestine in a Dish
    about 250 g (5 from 780 g flour), Another Pantry about 150 g. We take the Smithsonian size; real street ka'ak is often
    larger, so use the range. The with_egg variant is one bread, 2 sliced boiled eggs and a spoon of zaatar and oil
    (the Jerusalem street breakfast); its pot is 6 sandwiches (about 270 g each). Sesame
    uptake and any oil or salt in the filling are the main uncertainties. Water only sets the cooked weight (about 10% is lost in
    baking). Ka'ak with falafel waits for the falafel batch. Yeast is modelled with the compressed baker's yeast entry (usda:yeast_bakers) at the dry-yeast weight in the recipe; dry yeast is about 3 times denser, so energy is understated by under 15 kcal per pot (below 0.5%). AI verification 2026-10-30 (A17/A18 number check, D-087): every variant independently recalculated from the catalog ingredients by a second agent; plate and range judged plausible, and the review findings (aliases, provenance, notes) were fixed.
