  sources:
    - "Smithsonian Folklife Festival, Palestinian recipe: Ka'ak al-Quds sesame ring bread (500 g flour, 350 ml milk, 150 g sesame, molasses; yields 6 breads): https://festival.si.edu/blog/palestinian-recipe-kaak-al-quds-sesame-ring-bread"
    - "Palestine in a Dish, Ka'ek al-Quds (about 780 g flour, 227 g sesame, 54 g olive oil, 5 breads): https://palestineinadish.com/recipes/kaek-al-quds-a-crusty-and-simple-jerusalem-sesame-bread/print/3010/"
