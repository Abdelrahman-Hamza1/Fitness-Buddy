    - "USDA FoodData Central (SR Legacy) for every ingredient"
  notes: >-
    The two recipes differ in size by a factor of 2.5: the default is the large open pie (8 from 375 g flour, about 150 g
    each after baking, close to a bakery piece); sfiha_small is the 9 cm party pie (24, about 63 g each; a plate of
    3 is 190 g). Cooked weights are modelled (about 10% of the dough and 20% of the topping is lost on baking), not weighed. Lamb
    fat is counted in full although some drips off in the oven; bakery pies use more fat and less tomato (a bakery
    piece can be 100-150 kcal higher). Pomegranate molasses is modelled with plain molasses. Ayran or salad at the side
    are not included. Yeast is modelled with the compressed baker's yeast entry (usda:yeast_bakers) at the dry-yeast weight in the recipe; dry yeast is about 3 times denser, so energy is understated by under 15 kcal per pot (below 0.5%). AI verification 2026-10-30 (A17/A18 number check, D-087): every variant independently recalculated from the catalog ingredients by a second agent; plate and range judged plausible, and the review findings (aliases, provenance, notes) were fixed.
