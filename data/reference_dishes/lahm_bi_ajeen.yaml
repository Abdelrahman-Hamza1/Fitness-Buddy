    - "Soul Spoon, Sfeeha (500 g flour, 500 g lamb mince, 3 tbsp pomegranate molasses; 24 pies of 9 cm): https://soul-spoon.pages.dev/r/cuisine/syria/side-dishes/sfeeha"
