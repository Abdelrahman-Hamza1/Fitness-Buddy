  notes: 'Default all-date 1208 g input minus 88 g bake steam = 1120 g; all-walnut 1242 g input minus 92 g = 1150
    g. Both batches make 32 cookies, doubling the source half-batch filling. Whole pitted Deglet Noor proxies date
    paste without added sugar/oil. This model uses butter, no ghee; source 2 uses extra ghee and fat inside date
    filling, which can make much richer cookies. No unmeasured fat added in reference; ingredient ranges cover butter
    variation, not arbitrary date paste packages. Optional sugar dusting omitted (about 4 kcal per added gram).
    Mahlab omitted from nutrients because catalog lacks it. Cooked weights and household portion ranges are modelled,
    not measured; ranges allow serving size and ingredient variation. Authored by Codex 2026-10-30 (A19 + A30);
