  sources:
    - "The Matbakh, Lebanese chicken and rice, riz a djej (serves 6: 1.5 kg chicken, 0.5 lb minced beef or lamb, 2 cups long-grain rice, 2 tbsp olive oil or butter, 1 cup mixed nuts, 4 cups stock): https://thematbakh.com/wprm_print/lebanese-chicken-and-rice-riz-a-djej"
    - "Feel Good Foodie, Lebanese chicken and rice (1 lb ground beef, 2 tbsp butter; snippet only, page blocked): https://feelgoodfoodie.net/recipe/lebanese-chicken-and-rice"
    - "Falasteeni Foodie, Chicken maqluba (rice cooked in 6 cups of the chicken broth; used for the broth to rice ratio only): https://falasteenifoodie.com/chicken-maqluba-flipped-upside-down/"
    - "USDA FoodData Central (SR Legacy) for every ingredient"
  notes: >-
    The catalog name "chicken and rice" covers the home pot of spiced rice with poached chicken pieces on top (djaj ma
    ruz); no Palestinian source with grams was found, so the Levantine riz a djej recipe is used (a Lebanese recipe: the
    Palestinian home version is close but often has no mince). Maqluba (layered, flipped), kabsa and mansaf are separate
    dishes. Chicken is skin-on and its fat is counted in full although most of the poaching fat stays in the stock (the rice takes only 4
    cups), so a skinless version is about 150 kcal per plate lighter. Cooked weight is modelled (rice about 2.7x plus the
    shredded chicken at 0.75), not weighed. Fat for the rice and the nuts are the biggest uncertainties. AI verification 2026-10-30 (A17/A18 number check, D-087): every variant independently recalculated from the catalog ingredients by a second agent; plate and range judged plausible, and the review findings (aliases, provenance, notes) were fixed.
