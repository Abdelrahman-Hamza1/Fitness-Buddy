    Dina's recipe makes 32 small pies of about 45 g (24 g dough plus 25 g cheese); bakery and home fatayer jibneh are
    usually bigger (70-100 g), so the piece is 70 g (the pot per 100 g is the same, so a piece is just a larger share) and
    small_piece is the 45 g party size. A plate is 3 pieces. Cheese weight per piece varies between recipes; cheese brine, feta or mozzarella substitutes change fat by +-5 g per 100 g. Cooked weight is
    modelled (about 8% lost on baking). Not covered: fried (sambousek) cheese pies. Yeast is modelled with the compressed baker's yeast entry (usda:yeast_bakers) at the dry-yeast weight in the recipe; dry yeast is about 3 times denser, so energy is understated by under 15 kcal per pot (below 0.5%). AI verification 2026-10-30 (A17/A18 number check, D-087): every variant independently recalculated from the catalog ingredients by a second agent; plate and range judged plausible, and the review findings (aliases, provenance, notes) were fixed.
