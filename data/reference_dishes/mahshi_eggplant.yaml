  notes: >-
    Fix round 2026-10-30: NOT SUPPORTED FOR RELEASE; keep draft. Removed piece: the 2400 g whole-pot
    composition includes sauce and cannot represent a drained 100 g vegetable. At 20 vegetables the old
    pot model would allocate 120 g including sauce, not 100 g. The 480 g plate and nutrient rows are
    unchanged diagnostic placeholders, not verified nutrition. Original source supports a mixed pot (12
    eggplants, 8 zucchini), not 1000 g cored shells of either single vegetable. Additional researched
    Hungry Paprikas kousa recipe weighs 2 kg whole squash BEFORE coring and notes leftover filling; it
    cannot establish edible shell mass or filling retained for this adaptation. No supported shell
    conversion, 380 g extra water, sauce retention or finished yield was found. Do not infer these from
    a mass subtraction. Replacing the current 2677.5 g input / 2400 g cooked pot requires measured cored
    shells, actual water and finished pot/solids/sauce weights. All meat fat and served sauce are
    counted in the provisional composition; no side rice. No piece may return without a separate
    supported solids/sauce allocation.
