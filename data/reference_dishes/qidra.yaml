  notes: >-
    The pot is 4 plates (420 g, source serves 4); lamb pieces on top of the rice make a plate heavier on meat than
    this average, so a plate with 2-3 pieces of lamb is nearer to 600 kcal of meat alone. The cooked weight is modelled
    (rice takes 3 cups of broth for 1.5 cups, lamb loses a third of its weight), not weighed. Lamb fat and ghee are the biggest
    uncertainties: all lamb fat is counted although the broth is skimmed in many homes, so a plate can be about 150-250 kcal
    lower. The default is a plate of about 1000 kcal, high for a 420 g plate, so please check it first. Hebron-style qidra (plain, few spices) and versions with whole garlic and chickpeas are both covered by the
    same numbers. Yogurt and salad at the side are not included. Please check against your family's cooking. AI verification 2026-10-30 (A17/A18 number check, D-087): every variant independently recalculated from the catalog ingredients by a second agent; plate and range judged plausible, and the review findings (aliases, provenance, notes) were fixed.
