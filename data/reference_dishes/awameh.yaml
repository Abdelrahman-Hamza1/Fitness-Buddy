  - "Al-Ismail et al. (2021), Table III commercial awameh fat: https://www.innovhub-ssi.it/kdocs/2012987/2021_vol._982_-_art._06_-_al-ismail.pdf"
  notes: >-
    Fix round 2026-10-30: NOT SUPPORTED FOR RELEASE; keep draft. Existing 60 balls, 90 g absorbed oil,
    240 g syrup sugar, 120 g syrup water and 1050 g finished yield remain UNSUPPORTED diagnostic
    placeholders. Original batter ingredients are supported; a subtraction of assumed steam does not
    support these decisive quantities. Hungry Paprikas publishes a 45-piece yield for its DIFFERENT
    1.5-cup-flour batter, not 60 pieces for this 2.25-cup recipe; its 2 cups oil is the frying bath, not
    absorbed oil. A 2023 Egyptian Journal of Food Science study reports luqmat-el-qady sugar-syrup
    absorption 0.25 g/g (search-index extract; full PDF fetch timed out), but using it here still needs
    a compatible pre-syrup fried mass, syrup concentration and absorbed oil. Do not turn 0.25 g/g into
    240 g retained sugar or splice different batters together. Al-Ismail Table III reports 6.69% fat in
    sampled commercial awameh; this is a compositional cross-check, not an oil-uptake measurement for
    the current batter. No honest complete replacement found. Need a matched recipe with counted
    finished pieces, pre/post-fry weights and retained syrup. The 18 g piece (six-piece 108 g serving)
    and 1138.8 g rows minus 88.8 g steam are provisional only. Dry yeast nutrient proxy uses compressed
    yeast; small baking-powder/blossom-water quantities omitted.
