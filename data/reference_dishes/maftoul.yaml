    100-200 kcal lower or higher. Please check against your family's cooking (many pots use more ghee on the
    maftoul and no olive oil in the broth). Yogurt and salad at the side are not included. AI verification 2026-10-30 (A17/A18 number check, D-087): every variant independently recalculated from the catalog ingredients by a second agent; plate and range judged plausible, and the review findings (aliases, provenance, notes) were fixed.
