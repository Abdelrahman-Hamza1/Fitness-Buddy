  notes: >-
    Falasteeni Foodie says serves 3 but the quantities are closer to 4 plates (450 g); small_plate is the pot divided by 6.
    The cooked weight (1.8 kg) is modelled, not weighed: maftoul absorbs about 2.5 times its weight in broth. The grain
    is modelled with couscous (USDA lacks maftoul). The two fat entries and the chicken skin make up about 45% of the
