    finished mass. Fresh mozzarella in the original source is specifically NOT the generic whole-milk
    mozzarella FDC row used here: that row is an undiscriminated proxy, not a verified fresh-cheese
    composition. Rework needs a matching fresh-mozzarella label, complete used-dough weight and retained
    syrup/finished-tray weight. Desalted Akkawi and Nabulsi remain disclosed brined-label proxies; ghee
    conversion uses 240 ml cup and assumed 0.92 g/ml. The subtraction 1939 g input minus 189 g steam is
    an assumption, not independent yield evidence.
