  notes: >-
    Fix round 2026-10-30: NOT SUPPORTED FOR RELEASE; keep draft. No evidence-based replacement found for
    80% of the flour/semolina dough, 300 g retained sugar, 150 g retained syrup water or 1750 g finished
    mass. Existing rows and 145 g piece are frozen diagnostic placeholders, not a supported preparation.
    An alternative Cleobuttera naameh recipe specifies 375 g kataifi, 800 g cheese and about 3/4 cup
