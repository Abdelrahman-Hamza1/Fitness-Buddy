  notes: >-
    Both recipes serve 2, but the whole bowl (about 750 g) is more than most people eat as a side, so a bowl is 200 g and
    a plate 300 g. The salad is raw, so the cooked weight is the sum of the ingredients. The dressing oil is the main
    variable (2-3 tbsp in the pot, 5-9 g per bowl); restaurant versions are oilier and often add sumac. Bread and
    olive oil poured over at the table are not included. The herb_heavy variant (salata frangyeh) is a parsley-and-mint
    salad and is much lower in energy per 100 g. AI verification 2026-10-30 (A17/A18 number check, D-087): every variant independently recalculated from the catalog ingredients by a second agent; plate and range judged plausible, and the review findings (aliases, provenance, notes) were fixed.
