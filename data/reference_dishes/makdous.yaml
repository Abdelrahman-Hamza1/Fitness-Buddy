  notes: >-
    Counted for the drained eggplants and their filling (40 pieces of about 55 g each; the eggplants are boiled, pressed and
    lose about a third of their weight, so 2 kg raw becomes about 1.3 kg). The amount of oil each piece soaks up from the
    jar (about 6 g per piece here) is the biggest uncertainty (range 4-11 g); pieces taken straight from the jar and
    not drained are oilier. Walnut and pepper amounts vary widely between families, and the Palestinian makdous
    often uses shatta (chili paste), not counted here. Olive oil in the jar that is not eaten is not counted. Nutrients are
    estimated from raw eggplant (the boiling loss is in the cooked weight, not in the ingredient). AI verification 2026-10-30 (A17/A18 number check, D-087): every variant independently recalculated from the catalog ingredients by a second agent; plate and range judged plausible, and the review findings (aliases, provenance, notes) were fixed.
