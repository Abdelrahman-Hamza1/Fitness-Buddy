# g or ml. Spoon weights for labaneh and zaatar live in their dish files.
# Sources: USDA SR Legacy 2018-04 portions (CC0) by FDC ID, or a stated household measure.
# Unit codes are the fb_domain codes; `slice` is not one yet, so sliced bread uses piece.
