name: fitness-buddy
x-runtime: &runtime
  image: fitness-buddy-api:local
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 30s
x-app-environment: &app-environment
  # Local-only credentials. S05 provisions environment secrets independently.
  ASPNETCORE_ENVIRONMENT: Development
  DOTNET_ENVIRONMENT: Development
  ConnectionStrings__Application: Host=postgres;Database=fitness_buddy;Username=fb_app;Password=local-app-only
  Observability__ConsoleExporter: "true"
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    # Statement errors can echo private values even when client-side diagnostics are scrubbed.
    command: [postgres, -c, log_min_messages=fatal, -c, log_min_error_statement=panic, -c, log_error_verbosity=terse, -c, log_statement=none, -c, log_parameter_max_length=0, -c, log_parameter_max_length_on_error=0]
    environment:
      POSTGRES_DB: fitness_buddy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-admin-only
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    # PostgreSQL 18 keeps data in a version-specific subdirectory beneath this mount.
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/001-roles.sql:/docker-entrypoint-initdb.d/001-roles.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d fitness_buddy"]
      interval: 1s
      timeout: 3s
      retries: 30
    stop_grace_period: 30s
  migrate:
    <<: *runtime
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: [migrate]
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Migrator: Host=postgres;Database=fitness_buddy;Username=fb_migrator;Password=local-migrator-only
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *runtime
    ports:
      - "127.0.0.1:5198:8080"
    environment:
      <<: *app-environment
      Clients__MinimumAppVersion: "${FB_MIN_APP_VERSION:-0.1.0}"
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    <<: *runtime
    command: [worker]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres-data:
