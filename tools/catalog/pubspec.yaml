name: fb_catalog
description: >-
  Food catalog tooling (A03): USDA FoodData Central import for the basics.
  Never shipped in the app.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

executables:
  catalog: catalog

dependencies:
  # Versions already in the workspace lockfile (Flutter's own tooling pins).
  args: ^2.7.0
  fb_domain: any
  fb_text: any
  # Dish and selection schemas (A03 D5/D10); dev tool only, never in the app.
  json_schema: 5.2.2
  path: ^1.9.1
  # Same constraint as the app (A01); bundles SQLite with FTS5 trigram.
  sqlite3: ^3.7.1
  yaml: ^3.1.3

dev_dependencies:
  test: 1.31.1
  very_good_analysis: 11.0.0
