name: fb_sync
description: "Pure Dart sync engine for Fitness Buddy (A34, TD-006): outbox push, paged pull and dataset reset behind store and transport ports."
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

# Runtime dependencies are on the allowlist in test/dependencies_test.dart:
# the generated wire models (fb_api_client, which brings dio) and the HLC
# (fb_domain). No Flutter, no database: the app implements the store port
# with drift, the tests and tools/sync_sim with the in-memory store.
dependencies:
  # Same exact pin as fb_api_client (the API transport maps its errors).
  dio: 5.11.1
  fb_api_client:
    path: ../fb_api_client
  fb_domain:
    path: ../fb_domain

dev_dependencies:
  # Pinned to the version Flutter's own tooling uses (test_api 0.7.12), so the
  # Flutter app can join this workspace without a version conflict.
  test: 1.31.1
  very_good_analysis: 11.0.0
  yaml: ^3.1.3
