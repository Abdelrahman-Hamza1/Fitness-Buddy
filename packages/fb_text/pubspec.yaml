name: fb_text
description: Pure Dart Arabic/Arabizi text normalization and unit/number parsing for Fitness Buddy.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

# No runtime dependencies. Adding one needs an entry in the allowlist in
# test/dependencies_test.dart.

dev_dependencies:
  # Dev only (S08 D12): a test checks that every unit code the parser returns
  # is a unit fb_domain knows. fb_text itself never imports fb_domain.
  fb_domain:
    path: ../fb_domain
  # Property tests (S08 D14). Pinned: last release Dec 2023, dev only; the
  # fallback is kiri_check 1.3.2 if a future SDK breaks it.
  glados: 1.1.7
  # Pinned to the version Flutter's own tooling uses (test_api 0.7.12), so the
  # Flutter app can join this workspace without a version conflict.
  test: 1.31.1
  very_good_analysis: 11.0.0
  yaml: ^3.1.3
