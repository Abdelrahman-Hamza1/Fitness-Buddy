# Search-key normalization cases (S08 D11 + A1-A3, D13, TD-030).
#
# The shared spec for normalizeKey: fb_text (Dart) and the Catalog module (C#)
# both load this file and must pass every case. Format, pipeline, tables and
# the pass rule: README.md in this folder ("normalization_cases.yaml").
#
# Rules for editing: ids are stable (never rename or reuse one), every input
# and key is double-quoted, invisible and look-alike characters are written as
# \uXXXX escapes. A bug fix on either side starts with a new case here.
version: 1
cases:
