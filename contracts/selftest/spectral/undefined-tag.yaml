# expect: operation-tag-defined
# An operation tag that is not declared in the top-level tags.
openapi: 3.1.1
info:
  title: Spectral self-test
  version: 0.0.0
  description: 'An operation tag that is not declared in the top-level tags.'
servers:
  - url: http://localhost:8080
tags:
  - name: Test
    description: Self-test operations.
paths:
  /v1/things:
    get:
      tags: [Undeclared]
      operationId: getThing
      description: Returns a thing.
      parameters:
        - $ref: './_shared.yaml#/components/parameters/AppVersion'
        - $ref: './_shared.yaml#/components/parameters/Platform'
        - $ref: './_shared.yaml#/components/parameters/DeviceId'
      responses:
        '200':
          $ref: './_shared.yaml#/components/responses/Thing'
        '500':
          $ref: './_shared.yaml#/components/responses/InternalError'
