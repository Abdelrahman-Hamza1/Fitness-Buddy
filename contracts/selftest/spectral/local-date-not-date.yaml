# expect: fb-local-date-format
# A local date property (localDate) with format date-time instead of date.
openapi: 3.1.1
info:
  title: Spectral self-test
  version: 0.0.0
  description: 'A local date property (localDate) with format date-time instead of date.'
servers:
  - url: http://localhost:8080
tags:
  - name: Test
    description: Self-test operations.
paths:
  /v1/things:
    get:
      tags: [Test]
      operationId: getThing
      description: Returns a thing.
      parameters:
        - $ref: './_shared.yaml#/components/parameters/AppVersion'
        - $ref: './_shared.yaml#/components/parameters/Platform'
        - $ref: './_shared.yaml#/components/parameters/DeviceId'
      responses:
        '200':
          description: A thing.
          content:
            application/json:
              schema:
                type: object
                required: [value]
                properties:
                  value: { type: string }
                  localDate: { type: string, format: date-time }
        '500':
          $ref: './_shared.yaml#/components/responses/InternalError'
