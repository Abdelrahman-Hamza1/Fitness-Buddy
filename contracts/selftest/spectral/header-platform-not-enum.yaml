# expect: fb-client-headers
# X-Platform declared as a free string instead of the android|ios enum.
openapi: 3.1.1
info:
  title: Spectral self-test
  version: 0.0.0
  description: 'X-Platform declared as a free string instead of the android|ios enum.'
servers:
  - url: http://localhost:8080
tags:
  - name: Test
    description: Self-test operations.
paths:
  /v1/things:
    get:
      tags: [Test]
      operationId: getThing
      description: Returns a thing.
      parameters:
        - $ref: './_shared.yaml#/components/parameters/AppVersion'
        - name: X-Platform
          in: header
          required: true
          schema: { type: string }
        - $ref: './_shared.yaml#/components/parameters/DeviceId'
      responses:
        '200':
          $ref: './_shared.yaml#/components/responses/Thing'
        '500':
          $ref: './_shared.yaml#/components/responses/InternalError'
