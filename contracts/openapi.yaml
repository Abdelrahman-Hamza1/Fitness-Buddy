        featureFlags:
          type: object
          description: Feature flags by name. A flag the app doesn't know is ignored; a missing flag means off.
          additionalProperties:
            type: boolean
        thresholds:
          type: object
          description: 'Numeric client thresholds by name. A missing threshold means the app''s built-in default. Proposal question thresholds (AI-060): proposalQuestionRelativeDelta defaults to 0.20 and proposalQuestionKcalDelta defaults to 50 kcal; both strict thresholds must be exceeded. Effective thresholds are snapshotted per proposal message session. The two-question message budget is fixed in client code, never configurable.'
          additionalProperties:
            type: number
            format: double
  parameters:
    AppVersion:
      name: X-App-Version
      in: header
      required: true
      description: The app's version, `MAJOR.MINOR.PATCH`. Missing or invalid → 400; below `ClientConfig.minimumAppVersion` → 426 (except `getConfig`). Set by the API client, not by callers.
      schema:
        type: string
    Platform:
      name: X-Platform
      in: header
      required: true
      description: The app's platform. Set by the API client, not by callers.
      schema:
        type: string
        enum:
          - android
          - ios
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: A random install ID (UUID) generated on first launch. Not a hardware identifier. Set by the API client, not by callers.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required on every unsafe POST. The server stores the result for 24 h and replays it for a repeated key (Buddy uses the chat message ID).
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque position returned as `nextCursor` by the previous page. Omit it for the first page. Never build or parse it on the client.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items in the page. Each endpoint documents its own default and maximum.
      schema:
        type: integer
        format: int32
        minimum: 1
  headers:
    XRequestId:
      description: 'Sent on every response. The request''s W3C trace id (32 lowercase hex), the same value as `traceId` in a problem body and in the server''s log lines. Quote it when reporting a problem. Response only: an inbound `X-Request-Id` is ignored (correlation in is W3C `traceparent`).'
      schema:
        type: string
        pattern: ^[0-9a-f]{32}$
    RetryAfter:
      description: Seconds until a retry may succeed.
      schema:
        type: integer
        minimum: 0
    RateLimit:
      description: The remaining quota (draft-ietf-httpapi-ratelimit-headers-11), for example `"per-ip";r=0;t=37`. Sent on 429 only.
      schema:
        type: string
    RateLimitPolicy:
      description: The quota policy (draft-ietf-httpapi-ratelimit-headers-11), for example `"per-ip";q=300;w=60`. Sent on 429 only.
      schema:
        type: string
  responses:
    ValidationFailed:
      description: 'The request is invalid (`/errors/validation-failed`): a field, a client header, or a body that could not be read. `errors` names the fields.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
          example:
            type: /errors/validation-failed
            title: One or more validation errors occurred.
            status: 400
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            errors:
              name:
                - The name field is required.
              items[0].qty:
                - The field qty must be between 1 and 1000.
    UpgradeRequired:
      description: The app is older than `ClientConfig.minimumAppVersion` (`/errors/upgrade-required`). The app shows its update screen.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: /errors/upgrade-required
            title: Upgrade required
            status: 426
            detail: This app version is no longer supported. Update the app.
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    RateLimited:
      description: Too many requests (`/errors/rate-limited`). Retry after `Retry-After` seconds.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: /errors/rate-limited
            title: Too many requests
            status: 429
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    InternalError:
      description: Unexpected server error. Retry later; quote `traceId` (= the `X-Request-Id` response header) when reporting it.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://tools.ietf.org/html/rfc9110#section-15.6.1
            title: An error occurred while processing your request.
            status: 500
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    ServiceUnavailable:
      description: Service temporarily unavailable.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
