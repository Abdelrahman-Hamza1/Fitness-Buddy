          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientConfig'
              example:
                minimumAppVersion: 0.1.0
                featureFlags: {}
                thresholds: {}
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Id:
      type: string
      format: uuid
      description: A UUIDv7 (time-ordered), generated where the object is created (usually on the device), lower-case canonical text form.
      examples:
        - 0192a5d4-7c3e-7b1a-9f2e-3c4d5e6f7a8b
    Instant:
      type: string
      format: date-time
      description: A point in time, RFC 3339 in UTC with a `Z` suffix. Pair it with a `TzOffsetMin` wherever the local time matters.
      examples:
        - '2026-10-13T07:30:00Z'
    LocalDate:
      type: string
      format: date
