    BuddyBatch:
      type: object
      description: A home-cooked batch (AI-100). The app owns the remaining-amount arithmetic.
      required:
        - kind
        - language
        - script
        - name
        - ingredients
        - cookedWeight
        - path
        - eatenNow
        - timeHint
        - slotHint
        - dateHint
      properties:
