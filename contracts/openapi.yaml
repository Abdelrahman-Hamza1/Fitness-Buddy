    BuddyTurnStart:
      type: object
      description: Starts a turn (06 §3.1). Lists are bounded by the schema; texts are user content and never logged.
      required:
        - turnId
        - mode
        - message
        - history
        - summary
        - compact
        - personal
        - profile
        - snapshot
        - ackTurn
        - priorAttempt
        - trace
      properties:
        turnId:
          type: string
          format: uuid
          description: The user chat message ID (UUIDv7); equals Idempotency-Key and names the turn in SSE ids and proposal IDs.
        mode:
          $ref: '#/components/schemas/BuddyTurnMode'
          description: 'chat, or weeklyReview (B26: aggregates only, no phone tools).'
        message:
          $ref: '#/components/schemas/BuddyTurnMessage'
        history:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/BuddyHistoryEntry'
          description: The last 12 chat entries, oldest first, with their card outcomes (TD-126).
        summary:
          oneOf:
            - $ref: '#/components/schemas/BuddyConversationSummary'
            - type: 'null'
          description: The phone's current conversation summary, or null.
        compact:
          oneOf:
            - $ref: '#/components/schemas/BuddyCompaction'
            - type: 'null'
          description: Entries evicted past the summary's watermark (the phone owns compaction, 06 §6.1); the server answers with a summary event before done.
        personal:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/BuddyPersonalItem'
          description: 'The personal slice: up to 20 personal foods, saved meals, open batches and usual meals pre-matched on the phone against the message tokens (fb_text normalization), with their facts. Resolved before the catalog (AI-070).'
        profile:
          $ref: '#/components/schemas/BuddyTurnProfile'
        snapshot:
          $ref: '#/components/schemas/BuddyTurnSnapshot'
        ackTurn:
          oneOf:
            - $ref: '#/components/schemas/BuddyTurnReference'
            - type: 'null'
          description: The previous turn, acknowledging its final round (06 §3.4); null when there is none.
        priorAttempt:
          oneOf:
            - $ref: '#/components/schemas/BuddyPriorAttempt'
            - type: 'null'
          description: 'Retries only: the cards the earlier attempt of this round produced and what happened to them.'
        trace:
          type: boolean
          description: Dev builds only; honoured only when the server enables Buddy:Agent:TraceEnabled. Adds trace events for the phone, never logged.
      additionalProperties: false
