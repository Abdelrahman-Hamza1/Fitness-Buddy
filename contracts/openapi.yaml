      type: object
      required:
        - entity
        - id
        - hlc
        - status
        - reason
      properties:
        entity:
          type: string
        id:
          type: string
          format: uuid
        hlc:
          type: string
        status:
          type: string
          pattern: ^(accepted|stale|invalid)$
        reason:
          type:
            - string
            - 'null'
          pattern: ^(clockDrift|versionConflict|unsupported|invalidPayload|datasetMismatch)$
    SyncPushResponse:
      type: object
      required:
        - results
        - serverTime
        - datasetId
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SyncPushResult'
        serverTime:
          type: string
          format: date-time
        datasetId:
          type: string
          format: uuid
    SyncDocument:
      type: object
      description: A stored version with a decimal sequence. History sequences are in a separate cursor space.
      required:
        - entity
        - id
        - schemaVersion
        - hlc
        - deviceId
        - deletedAt
        - payload
        - serverSeq
        - compacted
      properties:
        entity:
          type: string
          minLength: 1
          maxLength: 64
        id:
          type: string
          format: uuid
        schemaVersion:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        hlc:
          type: string
          pattern: ^[0-9]{13}-[0-9]{5}-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        deviceId:
          type: string
          format: uuid
        deletedAt:
          type:
            - string
            - 'null'
          format: date-time
        payload:
          type: object
          additionalProperties: {}
        serverSeq:
          type: string
          pattern: ^(0|[1-9][0-9]{0,18})$
        compacted:
          type: boolean
          description: A retained deletion fence with empty payload; not an entity payload.
