      type: object
      required:
        - changes
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/SyncChange'
        datasetId:
          type:
            - string
            - 'null'
          format: uuid
          description: 'Optional for discovery only: unbound pushes perform no writes.'
