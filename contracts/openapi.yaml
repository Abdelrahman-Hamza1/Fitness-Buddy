          type: string
          format: uuid
        schemaVersion:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        hlc:
          type: string
          pattern: ^[0-9]{13}-[0-9]{5}-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        deviceId:
          type: string
          format: uuid
        deletedAt:
          type:
            - string
            - 'null'
          format: date-time
        payload:
          type: object
          additionalProperties: {}
