            format: int32
        - name: datasetId
          in: query
          required: false
          description: Dataset binding; omit only when starting discovery at cursor zero.
          schema:
            type:
              - string
              - 'null'
            format: uuid
        - name: entity
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sync result; dataset mismatch never acknowledges or writes a version.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: Invalid credentials or inactive session.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: This account cannot perform this operation.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - bearerAuth: []
  /v1/config:
    get:
      tags:
        - Account
      operationId: getConfig
      summary: Get the client configuration
      description: 'What the app needs to know about the server''s expectations: the minimum supported app version, feature flags and client thresholds. The app fetches it in the background and caches it; it is never on the startup path. Never answers 426: it is how an outdated app learns `minimumAppVersion`.'
      parameters:
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: The current client configuration.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientConfig'
              example:
                minimumAppVersion: 0.1.0
                featureFlags: {}
                thresholds: {}
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Id:
      type: string
      format: uuid
      description: A UUIDv7 (time-ordered), generated where the object is created (usually on the device), lower-case canonical text form.
      examples:
        - 0192a5d4-7c3e-7b1a-9f2e-3c4d5e6f7a8b
    Instant:
      type: string
      format: date-time
      description: A point in time, RFC 3339 in UTC with a `Z` suffix. Pair it with a `TzOffsetMin` wherever the local time matters.
      examples:
        - '2026-10-13T07:30:00Z'
    LocalDate:
      type: string
      format: date
      description: A calendar day without a time zone, `YYYY-MM-DD` (the user's local day when the thing happened).
      examples:
        - '2026-10-13'
    TzOffsetMin:
      type: integer
      format: int32
      minimum: -840
      maximum: 840
      description: The device's UTC offset in minutes at that moment (east of UTC is positive), e.g. 180 for UTC+3.
      examples:
        - 180
    Grams:
      type: number
      format: double
      description: Mass of food in grams (canonical food unit). Precision is documented per field.
    Milliliters:
      type: number
      format: double
      description: Volume in millilitres (canonical liquid unit). Precision is documented per field.
    Kilocalories:
      type: number
      format: double
      description: Energy in kilocalories (kcal). Precision is documented per field.
    Kilograms:
      type: number
      format: double
      description: Body or lifted weight in kilograms. Precision is documented per field.
    Centimeters:
      type: number
      format: double
      description: Body measurement or height in centimetres. Precision is documented per field.
    NextCursor:
      type:
        - string
        - 'null'
      description: Pass it as `cursor` to get the next page. `null` when this is the last page.
    ProblemDetails:
      type: object
      description: RFC 9457 problem details. Members not listed here are extensions and clients must ignore the ones they don't know.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          description: 'Identifies the kind of problem. Our own problems use a stable, relative reference `/errors/<kebab-slug>` from the catalogue in contracts/README.md (`/errors/validation-failed`, `/errors/rate-limited`, `/errors/version-conflict`, `/errors/upgrade-required`). It is an opaque string: clients compare it exactly and never dereference it, and an entry is never renamed or removed within an API version. Problems we don''t map carry the framework''s default (an RFC link or `about:blank`), so this is a free string, not an enum.'
        title:
          type: string
          description: Short, human-readable summary of the problem type (English, not for display as-is).
        status:
          type: integer
          format: int32
          description: The HTTP status code, repeated for convenience.
        detail:
          type: string
          description: Human-readable explanation of this occurrence (English, never user content).
        instance:
          type: string
          format: uri-reference
          description: Identifies this occurrence (for example the request path).
        traceId:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: W3C trace id of the request (32 lowercase hex), the same value as the `X-Request-Id` response header. Quote it when reporting a problem.
    ValidationProblemDetails:
      type: object
      description: 'The problem details of a `400 /errors/validation-failed`: the ProblemDetails members plus a required `errors` map.'
      required:
        - type
        - title
        - status
        - errors
      properties:
        type:
          type: string
          format: uri-reference
          description: Always `/errors/validation-failed`.
        title:
          type: string
          description: Short, human-readable summary of the problem type (English, not for display as-is).
        status:
          type: integer
          format: int32
          description: Always 400.
        detail:
          type: string
          description: Human-readable explanation of this occurrence (English, never user content).
        instance:
          type: string
          format: uri-reference
          description: Identifies this occurrence (for example the request path).
        traceId:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: W3C trace id of the request (32 lowercase hex), the same value as the `X-Request-Id` response header. Quote it when reporting a problem.
        errors:
          type: object
          description: Field (camelCase JSON path such as `items[0].qty`, or a lowercase header name such as `x-app-version`) → messages. Empty when the request could not be read (malformed JSON, wrong type, missing member).
          additionalProperties:
            type: array
            items:
              type: string
    AuthTokens:
      type: object
      required:
        - userId
        - isAnonymous
        - accessToken
        - refreshToken
        - expiresAt
        - refreshExpiresAt
      properties:
        userId:
          type: string
          format: uuid
        isAnonymous:
          type: boolean
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        refreshExpiresAt:
          type: string
          format: date-time
    GoogleSignInRequest:
      type: object
      required:
        - idToken
      properties:
        idToken:
          type: string
          minLength: 1
          maxLength: 16384
    EmailStartRequest:
      type: object
      required:
        - email
        - purpose
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        purpose:
          type: string
          pattern: ^(signIn|link)$
    EmailChallenge:
      type: object
      required:
        - challengeId
        - expiresAt
      properties:
        challengeId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
    EmailVerifyRequest:
      type: object
      required:
        - challengeId
        - code
      properties:
        challengeId:
          type: string
          format: uuid
        code:
          type: string
          pattern: ^[0-9]{6}$
    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 256
    LinkIdentityRequest:
      type: object
      required:
        - idToken
        - challengeId
        - code
      properties:
        idToken:
          type:
            - string
            - 'null'
          maxLength: 16384
        challengeId:
          type:
            - string
            - 'null'
          format: uuid
        code:
          type:
            - string
            - 'null'
          pattern: ^[0-9]{6}$
    JsonWebKey:
      type: object
      required:
        - kty
        - crv
        - kid
        - x
        - 'y'
        - alg
        - use
      properties:
        kty:
          type: string
        crv:
          type: string
        kid:
          type: string
        x:
          type: string
        'y':
          type: string
        alg:
          type: string
        use:
          type: string
    JsonWebKeySet:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/JsonWebKey'
    CurrentAccount:
      type: object
      required:
        - userId
        - isAnonymous
        - status
      properties:
        userId:
          type: string
          format: uuid
        isAnonymous:
          type: boolean
        status:
          type: string
    SyncChange:
      type: object
      description: An immutable client version; a non-null deletedAt marks a tombstone.
      required:
        - entity
        - id
        - schemaVersion
        - hlc
        - deviceId
        - deletedAt
        - payload
      properties:
        entity:
          type: string
          minLength: 1
          maxLength: 64
        id:
          type: string
          format: uuid
        schemaVersion:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        hlc:
          type: string
          pattern: ^[0-9]{13}-[0-9]{5}-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        deviceId:
          type: string
          format: uuid
        deletedAt:
          type:
            - string
            - 'null'
          format: date-time
        payload:
          type: object
          additionalProperties: {}
    SyncPushRequest:
      type: object
      required:
        - changes
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/SyncChange'
        datasetId:
          type:
            - string
            - 'null'
          format: uuid
          description: 'Optional for discovery only: unbound pushes perform no writes.'
    SyncPushResult:
      type: object
      required:
        - entity
        - id
        - hlc
        - status
        - reason
      properties:
        entity:
          type: string
        id:
          type: string
          format: uuid
        hlc:
          type: string
        status:
          type: string
          pattern: ^(accepted|stale|invalid)$
        reason:
          type:
            - string
            - 'null'
          pattern: ^(clockDrift|versionConflict|unsupported|invalidPayload|datasetMismatch)$
    SyncPushResponse:
      type: object
      required:
        - results
        - serverTime
        - datasetId
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SyncPushResult'
        serverTime:
          type: string
          format: date-time
        datasetId:
          type: string
          format: uuid
    SyncDocument:
      type: object
      description: A stored version with a decimal sequence. History sequences are in a separate cursor space.
      required:
        - entity
        - id
        - schemaVersion
        - hlc
        - deviceId
        - deletedAt
        - payload
        - serverSeq
        - compacted
      properties:
        entity:
          type: string
          minLength: 1
          maxLength: 64
        id:
          type: string
          format: uuid
        schemaVersion:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        hlc:
          type: string
          pattern: ^[0-9]{13}-[0-9]{5}-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        deviceId:
          type: string
          format: uuid
        deletedAt:
          type:
            - string
            - 'null'
          format: date-time
        payload:
          type: object
          additionalProperties: {}
        serverSeq:
          type: string
          pattern: ^(0|[1-9][0-9]{0,18})$
        compacted:
          type: boolean
          description: A retained deletion fence with empty payload; not an entity payload.
    SyncPage:
      type: object
      required:
        - changes
        - nextCursor
        - datasetId
        - serverTime
        - reason
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SyncDocument'
        nextCursor:
          type: string
          pattern: ^(0|[1-9][0-9]{0,18})$
        datasetId:
          type: string
          format: uuid
        serverTime:
          type: string
          format: date-time
        reason:
          type:
            - string
            - 'null'
          pattern: ^(datasetMismatch|cursorInvalid)$
    ClientConfig:
      type: object
      description: Server-controlled settings for the app.
      required:
        - minimumAppVersion
        - featureFlags
        - thresholds
      properties:
        minimumAppVersion:
          type: string
          pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$
          description: The oldest app version (`MAJOR.MINOR.PATCH`) the server still serves. Older apps are asked to update (426).
        featureFlags:
          type: object
          description: Feature flags by name. A flag the app doesn't know is ignored; a missing flag means off.
          additionalProperties:
            type: boolean
        thresholds:
          type: object
          description: Numeric client thresholds by name (for example the AI confidence minimum, AI-060). A missing threshold means the app's built-in default.
          additionalProperties:
            type: number
            format: double
  parameters:
    AppVersion:
      name: X-App-Version
      in: header
      required: true
      description: The app's version, `MAJOR.MINOR.PATCH`. Missing or invalid → 400; below `ClientConfig.minimumAppVersion` → 426 (except `getConfig`). Set by the API client, not by callers.
      schema:
        type: string
    Platform:
      name: X-Platform
      in: header
      required: true
      description: The app's platform. Set by the API client, not by callers.
      schema:
        type: string
        enum:
          - android
          - ios
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: A random install ID (UUID) generated on first launch. Not a hardware identifier. Set by the API client, not by callers.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required on every unsafe POST. The server stores the result for 24 h and replays it for a repeated key (Buddy uses the chat message ID).
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque position returned as `nextCursor` by the previous page. Omit it for the first page. Never build or parse it on the client.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items in the page. Each endpoint documents its own default and maximum.
      schema:
        type: integer
        format: int32
        minimum: 1
  headers:
    XRequestId:
      description: 'Sent on every response. The request''s W3C trace id (32 lowercase hex), the same value as `traceId` in a problem body and in the server''s log lines. Quote it when reporting a problem. Response only: an inbound `X-Request-Id` is ignored (correlation in is W3C `traceparent`).'
      schema:
        type: string
        pattern: ^[0-9a-f]{32}$
    RetryAfter:
      description: Seconds until a retry may succeed.
      schema:
        type: integer
        minimum: 0
    RateLimit:
      description: The remaining quota (draft-ietf-httpapi-ratelimit-headers-11), for example `"per-ip";r=0;t=37`. Sent on 429 only.
      schema:
        type: string
    RateLimitPolicy:
      description: The quota policy (draft-ietf-httpapi-ratelimit-headers-11), for example `"per-ip";q=300;w=60`. Sent on 429 only.
      schema:
        type: string
  responses:
    ValidationFailed:
      description: 'The request is invalid (`/errors/validation-failed`): a field, a client header, or a body that could not be read. `errors` names the fields.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
          example:
            type: /errors/validation-failed
            title: One or more validation errors occurred.
            status: 400
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            errors:
              name:
                - The name field is required.
              items[0].qty:
                - The field qty must be between 1 and 1000.
    UpgradeRequired:
      description: The app is older than `ClientConfig.minimumAppVersion` (`/errors/upgrade-required`). The app shows its update screen.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: /errors/upgrade-required
            title: Upgrade required
            status: 426
            detail: This app version is no longer supported. Update the app.
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    RateLimited:
      description: Too many requests (`/errors/rate-limited`). Retry after `Retry-After` seconds.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: /errors/rate-limited
            title: Too many requests
            status: 429
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    InternalError:
      description: Unexpected server error. Retry later; quote `traceId` (= the `X-Request-Id` response header) when reporting it.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://tools.ietf.org/html/rfc9110#section-15.6.1
            title: An error occurred while processing your request.
            status: 500
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
