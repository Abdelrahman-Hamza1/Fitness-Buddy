    ProblemDetails:
      type: object
      description: RFC 9457 problem details. Members not listed here are extensions and clients must ignore the ones they don't know.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          description: 'Identifies the kind of problem. Our own problems use a stable, relative reference `/errors/<kebab-slug>` from the catalogue in contracts/README.md (`/errors/validation-failed`, `/errors/rate-limited`, `/errors/version-conflict`, `/errors/upgrade-required`). It is an opaque string: clients compare it exactly and never dereference it, and an entry is never renamed or removed within an API version. Problems we don''t map carry the framework''s default (an RFC link or `about:blank`), so this is a free string, not an enum.'
        title:
          type: string
          description: Short, human-readable summary of the problem type (English, not for display as-is).
        status:
          type: integer
          format: int32
          description: The HTTP status code, repeated for convenience.
        detail:
          type: string
          description: Human-readable explanation of this occurrence (English, never user content).
        instance:
          type: string
          format: uri-reference
          description: Identifies this occurrence (for example the request path).
        traceId:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: W3C trace id of the request (32 lowercase hex), the same value as the `X-Request-Id` response header. Quote it when reporting a problem.
    ValidationProblemDetails:
      type: object
      description: 'The problem details of a `400 /errors/validation-failed`: the ProblemDetails members plus a required `errors` map.'
      required:
        - type
        - title
        - status
        - errors
      properties:
        type:
          type: string
          format: uri-reference
          description: Always `/errors/validation-failed`.
        title:
          type: string
          description: Short, human-readable summary of the problem type (English, not for display as-is).
        status:
          type: integer
          format: int32
          description: Always 400.
        detail:
          type: string
          description: Human-readable explanation of this occurrence (English, never user content).
        instance:
          type: string
          format: uri-reference
          description: Identifies this occurrence (for example the request path).
        traceId:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: W3C trace id of the request (32 lowercase hex), the same value as the `X-Request-Id` response header. Quote it when reporting a problem.
        errors:
          type: object
          description: Field (camelCase JSON path such as `items[0].qty`, or a lowercase header name such as `x-app-version`) → messages. Empty when the request could not be read (malformed JSON, wrong type, missing member).
          additionalProperties:
            type: array
            items:
              type: string
