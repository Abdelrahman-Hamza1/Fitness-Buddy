      description: Deletes the authenticated guest or registered account and all its user-owned server database records in one transaction. Returns 204 only after commit. A failed transaction leaves the account intact and retryable. After success all old access and refresh credentials are invalid; retrying with them returns 401, including after a lost 204 response. No user identifier or request body is accepted. This operation does not use the generic idempotency response cache. The app obtains confirmation before calling and wipes its local account data after confirmed completion. Existing backups expire within 30 days and cannot be used for direct restoration if they predate a deletion.
