          maxItems: 7
          items:
            type: integer
            format: int32
          description: ISO weekdays 1 (Monday) to 7; empty means every day.
    BuddyQueryPlan:
      type: object
      description: 'The frozen QueryPlan grammar (06 §6.3). Valid combinations (anything else is ok:false unsupportedPlan): remaining only with period today and kcal/protein/carbs/fat/fiber; total, average, max, min with kcal/protein/carbs/fat/fiber, sets, volume; latest, change with weight, weightTrend, measurement, exercisePr; count with workouts, sets, weighIns, loggedDays; last only with exerciseLastDate, filtered by exerciseRef or muscleGroup. Every period is at most 400 days.'
      required:
        - metric
        - measurementType
        - op
        - period
        - filters
      properties:
        metric:
          $ref: '#/components/schemas/BuddyQueryMetric'
        measurementType:
          type:
            - string
            - 'null'
          maxLength: 64
          description: 'With metric measurement: a built-in kind (waist, chest, hips, arm, thigh, neck, bodyFat) or a custom type UUID; otherwise null.'
        op:
          $ref: '#/components/schemas/BuddyQueryOp'
        period:
          $ref: '#/components/schemas/BuddyQueryPeriod'
        filters:
          oneOf:
            - $ref: '#/components/schemas/BuddyQueryFilters'
            - type: 'null'
