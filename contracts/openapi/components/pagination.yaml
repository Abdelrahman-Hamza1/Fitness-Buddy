# Cursor pagination (04 §4.2 "Pagination"): `cursor` + `limit` in, `nextCursor`
# out. Never offsets or page numbers (Spectral rule fb-no-offset-pagination).
# An endpoint that needs a `maximum` on `limit` declares its own copy of Limit
# with it (a $ref can't be narrowed).
components:
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque position returned as `nextCursor` by the previous page. Omit it
        for the first page. Never build or parse it on the client.
      schema:
        type: string

    Limit:
      name: limit
      in: query
      required: false
      description: >-
        Maximum number of items in the page. Each endpoint documents its own
        default and maximum.
      schema:
        type: integer
        format: int32
        minimum: 1

  schemas:
    NextCursor:
      type: [string, 'null']
      description: >-
        Pass it as `cursor` to get the next page. `null` when this is the last
        page.
