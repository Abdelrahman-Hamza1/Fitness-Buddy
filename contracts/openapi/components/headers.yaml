# Standard headers (04 §4.2 "Client headers", "Idempotency", "Tracing").
# Reference them as '../components/headers.yaml#/components/parameters/<Name>'.
components:
  parameters:
    AppVersion:
      name: X-App-Version
      in: header
      required: true
      description: >-
        The app's version, `MAJOR.MINOR.PATCH`. Missing or invalid → 400;
        below `ClientConfig.minimumAppVersion` → 426 (except `getConfig`). Set
        by the API client, not by callers.
      schema:
        type: string

    Platform:
      name: X-Platform
      in: header
      required: true
      description: The app's platform. Set by the API client, not by callers.
      schema:
        type: string
        enum: [android, ios]

    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: >-
        A random install ID (UUID) generated on first launch. Not a hardware
        identifier. Set by the API client, not by callers.
      schema:
        type: string
        format: uuid

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Required on every unsafe POST. The server stores the result for 24 h and
        replays it for a repeated key (Buddy uses the chat message ID).
      schema:
        type: string
        format: uuid

  headers:
    XRequestId:
      description: >-
        Sent on every response. The request's W3C trace id (32 lowercase hex),
        the same value as `traceId` in a problem body and in the server's log
        lines. Quote it when reporting a problem. Response only: an inbound
        `X-Request-Id` is ignored (correlation in is W3C `traceparent`).
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'

    RetryAfter:
      description: Seconds until a retry may succeed.
      schema:
        type: integer
        minimum: 0

    RateLimit:
      description: >-
        The remaining quota (draft-ietf-httpapi-ratelimit-headers-11), for
        example `"per-ip";r=0;t=37`. Sent on 429 only.
      schema:
        type: string

    RateLimitPolicy:
      description: >-
        The quota policy (draft-ietf-httpapi-ratelimit-headers-11), for example
        `"per-ip";q=300;w=60`. Sent on 429 only.
      schema:
        type: string
