{
  "paths": {
    "/v1/buddy/interpret": {
      "post": {
        "tags": [
          "Buddy"
        ],
        "operationId": "interpretMessage",
        "summary": "Interpret a message into read-only typed intents",
        "description": "Any authenticated user including guests. Idempotency-Key must equal the UUIDv7 requestId. Replay retention 24 hours. Conflicting input returns 409; an in-flight or ambiguous paid attempt returns 503 and is never automatically charged again for that key during retention. Context limits: 30 personal foods, 20 memory items, 30 recent entries, 20 each saved meals/open batches/custom exercises, 12 slots; names/values at most 200 characters. No images until the vision endpoint. Estimates are badged ranges only when no real match exists. Nutrition calculation and confirmation happen on the phone. Daily operational limits are tighter for guests; 429 never calls the provider.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "$ref": "../components/headers.yaml#/components/parameters/AppVersion"
          },
          {
            "$ref": "../components/headers.yaml#/components/parameters/Platform"
          },
          {
            "$ref": "../components/headers.yaml#/components/parameters/DeviceId"
          },
          {
            "$ref": "../components/headers.yaml#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/InterpretRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Validated interpretation; proposal input only.",
            "headers": {
              "X-Request-Id": {
                "$ref": "../components/headers.yaml#/components/headers/XRequestId"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/BuddyInterpretation"
                }
              }
            }
          },
          "400": {
            "$ref": "../components/problems.yaml#/components/responses/ValidationFailed"
          },
          "426": {
            "$ref": "../components/problems.yaml#/components/responses/UpgradeRequired"
          },
          "429": {
            "$ref": "../components/problems.yaml#/components/responses/RateLimited"
          },
          "500": {
            "$ref": "../components/problems.yaml#/components/responses/InternalError"
          },
          "503": {
            "$ref": "../components/problems.yaml#/components/responses/ServiceUnavailable"
          },
          "401": {
            "description": "Invalid credentials or inactive session.",
            "headers": {
              "X-Request-Id": {
                "$ref": "../components/headers.yaml#/components/headers/XRequestId"
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../components/problems.yaml#/components/schemas/ProblemDetails"
                }
              }
            }
          },
          "409": {
            "description": "Message key already used with different input.",
            "headers": {
              "X-Request-Id": {
                "$ref": "../components/headers.yaml#/components/headers/XRequestId"
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../components/problems.yaml#/components/schemas/ProblemDetails"
                }
              }
            }
          }
        }
      }
    }
  },
