{
  "paths": {
    "/v1/buddy/interpret": {
      "post": {
        "tags": [
          "Buddy"
        ],
        "operationId": "interpretMessage",
        "summary": "Interpret a message into read-only typed intents",
        "description": "Any authenticated user including guests. Idempotency-Key must equal the UUIDv7 requestId. Replay retention 24 hours. Conflicting input returns 409; an in-flight or ambiguous paid attempt returns 503 and is never automatically charged again for that key during retention. Forward compatibility (04 §4.2): new intent kinds and enum values are added without a version bump. The client routes an unknown kind, a known kind with an unknown enum value, or a dateHint it can't parse as unrecognized, and never defaults to a destructive operation. Clarify reasons: unclear, unsupported, offTopic, invalidInterpretation, unmatchedFood, referenceNotFound, medical. context.activeCard requires activeProposal (else 400). Context limits: 30 personal foods, 20 memory items, 30 recent entries, 20 each saved meals/open batches/custom exercises, 12 slots, 30 active-card lines; names/values at most 200 characters. No images until the vision endpoint. Estimates are badged ranges only when no real match exists. Nutrition calculation and confirmation happen on the phone. Daily operational limits are tighter for guests; 429 never calls the provider.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "$ref": "../components/headers.yaml#/components/parameters/AppVersion"
          },
          {
            "$ref": "../components/headers.yaml#/components/parameters/Platform"
          },
          {
            "$ref": "../components/headers.yaml#/components/parameters/DeviceId"
          },
          {
            "$ref": "../components/headers.yaml#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/InterpretRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Validated interpretation; proposal input only.",
            "headers": {
              "X-Request-Id": {
                "$ref": "../components/headers.yaml#/components/headers/XRequestId"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/BuddyInterpretation"
                }
              }
            }
          },
          "400": {
            "$ref": "../components/problems.yaml#/components/responses/ValidationFailed"
          },
          "426": {
            "$ref": "../components/problems.yaml#/components/responses/UpgradeRequired"
          },
          "429": {
            "$ref": "../components/problems.yaml#/components/responses/RateLimited"
          },
          "500": {
            "$ref": "../components/problems.yaml#/components/responses/InternalError"
          },
          "503": {
            "$ref": "../components/problems.yaml#/components/responses/ServiceUnavailable"
          },
          "401": {
            "description": "Invalid credentials or inactive session.",
            "headers": {
              "X-Request-Id": {
                "$ref": "../components/headers.yaml#/components/headers/XRequestId"
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../components/problems.yaml#/components/schemas/ProblemDetails"
                }
              }
            }
          },
          "409": {
            "description": "Message key already used with different input.",
            "headers": {
              "X-Request-Id": {
                "$ref": "../components/headers.yaml#/components/headers/XRequestId"
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../components/problems.yaml#/components/schemas/ProblemDetails"
                }
              }
            }
          }
        }
      }
    },
    "/v1/buddy/turns": {
      "post": {
        "tags": [
          "Buddy"
        ],
        "operationId": "startBuddyTurn",
        "summary": "Start a Buddy agent turn (one user message)",
        "description": "Runs round 0 of a turn (06 §3.1): history, summary, compaction, the personal slice, profile and snapshot come from the phone; the server never reads its sync copy. Every write is a proposal event; nothing is stored. A turn costs one allowance message however many rounds or retries it takes; 429 when that reservation is denied (no provider call), a later denied send ends with done reason quota. mode weeklyReview needs the weekly block (B26) and is answered 400 until then. Any authenticated user including guests. Idempotency-Key must equal turnId. The turn is stateless on the server: content-free ledger rows and, between rounds, a sealed continuation (06 §3.4). Retry rule: after an ambiguous disconnect (no terminal event) the app may retry the same round once with the same request plus priorAttempt; it re-runs as attempt 2 without a new message charge, a third attempt streams error expired. Errors before streaming are problems; afterwards they are error events. New event types, intent kinds and enum values are additive: the app ignores unknown events and routes unknown kinds as unrecognized.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "$ref": "../components/headers.yaml#/components/parameters/AppVersion"
          },
          {
            "$ref": "../components/headers.yaml#/components/parameters/Platform"
          },
          {
            "$ref": "../components/headers.yaml#/components/parameters/DeviceId"
          },
          {
            "$ref": "../components/headers.yaml#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/BuddyTurnStart"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "The round as a server-sent event stream: each event has `id: {turnId}:{round}:{seq}` and `data:` one BuddyTurnEvent JSON object; a `: ping` comment every 10 s; the round ends with phoneTools, done or error.",
            "headers": {
              "X-Request-Id": {
                "$ref": "../components/headers.yaml#/components/headers/XRequestId"
              }
            },
            "content": {
              "text/event-stream": {
                "schema": {
                  "$ref": "#/components/schemas/BuddyTurnEvent"
                }
              }
            }
          },
          "400": {
            "$ref": "../components/problems.yaml#/components/responses/ValidationFailed"
          },
          "426": {
            "$ref": "../components/problems.yaml#/components/responses/UpgradeRequired"
          },
          "429": {
            "$ref": "../components/problems.yaml#/components/responses/RateLimited"
          },
          "500": {
            "$ref": "../components/problems.yaml#/components/responses/InternalError"
          },
          "503": {
            "$ref": "../components/problems.yaml#/components/responses/ServiceUnavailable"
          },
          "401": {
            "description": "Invalid credentials or inactive session.",
            "headers": {
              "X-Request-Id": {
                "$ref": "../components/headers.yaml#/components/headers/XRequestId"
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../components/problems.yaml#/components/schemas/ProblemDetails"
                }
              }
            }
          },
          "409": {
            "description": "The round already ran and was acknowledged (roundAlreadyRan): start a new turn.",
            "headers": {
              "X-Request-Id": {
                "$ref": "../components/headers.yaml#/components/headers/XRequestId"
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../components/problems.yaml#/components/schemas/ProblemDetails"
                }
              }
            }
          }
        }
      }
    },
    "/v1/buddy/turns/continue": {
      "post": {
        "tags": [
          "Buddy"
        ],
        "operationId": "continueBuddyTurn",
        "summary": "Continue a paused turn with phone-tool results",
        "description": "Runs the round a phoneTools event announced (06 §3.2). results must answer exactly the pending call IDs (no missing, extra or duplicate IDs), each validating against its tool's data schema and caps; otherwise the stream answers error invalid with no send. An expired continuation (10 minutes) answers error expired. Posting round r+1 acknowledges round r. Any authenticated user including guests. Idempotency-Key must equal turnId. The turn is stateless on the server: content-free ledger rows and, between rounds, a sealed continuation (06 §3.4). Retry rule: after an ambiguous disconnect (no terminal event) the app may retry the same round once with the same request plus priorAttempt; it re-runs as attempt 2 without a new message charge, a third attempt streams error expired. Errors before streaming are problems; afterwards they are error events. New event types, intent kinds and enum values are additive: the app ignores unknown events and routes unknown kinds as unrecognized.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "$ref": "../components/headers.yaml#/components/parameters/AppVersion"
          },
          {
            "$ref": "../components/headers.yaml#/components/parameters/Platform"
          },
          {
            "$ref": "../components/headers.yaml#/components/parameters/DeviceId"
          },
          {
            "$ref": "../components/headers.yaml#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/BuddyTurnContinue"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "The round as a server-sent event stream: each event has `id: {turnId}:{round}:{seq}` and `data:` one BuddyTurnEvent JSON object; a `: ping` comment every 10 s; the round ends with phoneTools, done or error.",
            "headers": {
              "X-Request-Id": {
                "$ref": "../components/headers.yaml#/components/headers/XRequestId"
              }
            },
            "content": {
              "text/event-stream": {
                "schema": {
                  "$ref": "#/components/schemas/BuddyTurnEvent"
                }
              }
            }
          },
          "400": {
            "$ref": "../components/problems.yaml#/components/responses/ValidationFailed"
          },
          "426": {
            "$ref": "../components/problems.yaml#/components/responses/UpgradeRequired"
          },
          "429": {
            "$ref": "../components/problems.yaml#/components/responses/RateLimited"
          },
          "500": {
            "$ref": "../components/problems.yaml#/components/responses/InternalError"
          },
          "503": {
            "$ref": "../components/problems.yaml#/components/responses/ServiceUnavailable"
          },
          "401": {
            "description": "Invalid credentials or inactive session.",
            "headers": {
              "X-Request-Id": {
                "$ref": "../components/headers.yaml#/components/headers/XRequestId"
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../components/problems.yaml#/components/schemas/ProblemDetails"
                }
              }
            }
          },
          "409": {
            "description": "The round already ran and was acknowledged (roundAlreadyRan).",
            "headers": {
              "X-Request-Id": {
                "$ref": "../components/headers.yaml#/components/headers/XRequestId"
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../components/problems.yaml#/components/schemas/ProblemDetails"
                }
              }
            }
          }
        }
      }
    }
  },
