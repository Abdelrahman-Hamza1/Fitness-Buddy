          "weeklyChangeKg",
          "weighIns"
        ],
        "properties": {
          "from": {
            "type": "string",
            "format": "date"
          },
          "to": {
            "type": "string",
            "format": "date"
          },
          "startKg": {
            "type": "number",
            "format": "double"
          },
          "endKg": {
            "type": "number",
            "format": "double"
          },
          "changeKg": {
            "type": "number",
            "format": "double"
          },
          "weeklyChangeKg": {
            "type": [
              "number",
              "null"
            ],
            "format": "double"
          },
          "weighIns": {
            "type": "integer",
            "maximum": 400,
            "minimum": 0,
            "format": "int32"
          }
        }
      },
      "BuddyWorkout": {
        "type": "object",
        "description": "A workout session to log (B26, WO-030–033).",
        "required": [
          "kind",
          "name",
          "language",
          "script",
          "timeHint",
          "dateHint",
          "exercises"
        ],
        "properties": {
          "kind": {
            "type": "string",
            "enum": [
              "workout"
            ]
          },
          "name": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 120
          },
          "language": {
            "type": "string"
          },
          "script": {
            "type": "string"
          },
          "timeHint": {
            "type": [
              "string",
              "null"
            ]
          },
          "dateHint": {
            "type": [
              "string",
              "null"
            ],
            "pattern": "^(today|yesterday|daysAgo:([2-9]|[1-9][0-9]{1,2})|lastWeekday:(mon|tue|wed|thu|fri|sat|sun)|date:([0-9]{4}-)?(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01]))$"
          },
          "exercises": {
            "type": "array",
            "maxItems": 30,
            "minItems": 1,
            "items": {
              "$ref": "#/components/schemas/BuddyWorkoutExercise"
            }
          }
        }
      },
      "BuddyWorkoutExercise": {
        "type": "object",
        "required": [
          "mention",
          "exerciseRef",
          "sets",
          "assumptions"
        ],
        "properties": {
          "mention": {
            "type": "string",
            "maxLength": 200
          },
          "exerciseRef": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 64,
            "description": "A library exercise code or a custom exercise UUID; null when nothing matched (the app asks, WO-033)."
          },
          "sets": {
            "type": "array",
            "maxItems": 50,
            "items": {
              "$ref": "#/components/schemas/BuddyWorkoutSet"
            }
          },
          "assumptions": {
            "type": "array",
            "maxItems": 5,
            "items": {
              "type": "string"
            }
          }
        }
      },
      "BuddyWorkoutExerciseRow": {
        "type": "object",
        "required": [
          "name",
          "exerciseRef",
          "sets"
        ],
        "properties": {
          "name": {
            "type": "string",
            "maxLength": 200
          },
          "exerciseRef": {
            "type": "string",
            "maxLength": 64
          },
          "sets": {
            "type": "array",
            "maxItems": 50,
            "items": {
              "$ref": "#/components/schemas/BuddySetRow"
            }
          }
        }
      },
      "BuddyWorkoutSessionRow": {
        "type": "object",
        "required": [
          "name",
          "id",
          "date",
          "exercises"
        ],
        "properties": {
          "name": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 120
          },
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "date": {
            "type": "string",
            "format": "date"
          },
          "exercises": {
            "type": "array",
            "maxItems": 30,
            "items": {
              "$ref": "#/components/schemas/BuddyWorkoutExerciseRow"
            }
          }
        }
      },
      "BuddyWorkoutSet": {
        "type": "object",
        "required": [
          "reps",
          "weight",
          "unit",
          "perDumbbell",
          "durationSeconds",
          "distanceMeters"
        ],
        "properties": {
          "reps": {
            "type": [
              "integer",
              "null"
            ],
            "format": "int32"
          },
          "weight": {
            "type": [
              "number",
              "null"
            ],
            "maximum": 10000,
            "minimum": 0,
            "format": "double"
          },
          "unit": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/BuddyLoadUnit"
              },
              {
                "type": "null"
              }
            ]
          },
          "perDumbbell": {
            "type": "boolean",
            "description": "The stated weight is per dumbbell."
          },
          "durationSeconds": {
            "type": [
              "integer",
              "null"
            ],
            "format": "int32"
          },
          "distanceMeters": {
            "type": [
              "number",
              "null"
            ],
            "format": "double"
          }
        }
      },
      "BuddyUnsupportedResult": {
        "type": "object",
        "description": "Any call the app doesn't know: ok false, error unsupported, no data. The server treats it as a tool error.",
        "required": [
          "name",
          "callId",
          "ok",
          "error"
        ],
        "properties": {
          "name": {
            "type": "string",
            "enum": [
              "unsupported"
            ]
          },
          "callId": {
            "type": "string",
            "format": "uuid"
          },
          "ok": {
            "type": "boolean"
          },
          "error": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/BuddyPhoneToolError"
              },
              {
                "type": "null"
              }
            ]
          }
        }
      }
    }
  }
}
