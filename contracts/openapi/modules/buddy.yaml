          },
          "dateHint": {
            "type": [
              "string",
              "null"
            ],
            "pattern": "^(today|yesterday|daysAgo:([2-9]|[1-9][0-9]{1,2})|lastWeekday:(mon|tue|wed|thu|fri|sat|sun)|date:([0-9]{4}-)?(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01]))$",
            "description": "Closed day grammar the app resolves locally: today, yesterday, daysAgo:N (N is 2-999; 0 and 1 are today and yesterday), lastWeekday:mon..sun (the most recent such day strictly before today), date:[YYYY-]MM-DD (a date the user stated). The server guarantees a valid month/day, and a valid calendar date when a year is given. A missing year is the most recent past occurrence (02-29 resolves up to 4 years back); the app rejects future dates. A value the app can't parse routes the intent as unrecognized."
          },
          "dishGroup": {
            "type": [
              "string",
              "null"
