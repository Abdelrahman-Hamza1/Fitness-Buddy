{
  "paths": {
    "/v1/sync/push": {
      "post": {
        "tags": [
          "UserData"
        ],
        "operationId": "pushSync",
        "summary": "sync push",
        "description": "Registered-user document sync; immutable HLC versions, dataset-bound admission and recoverable history. See technical-planning/05 section 5.",
        "x-fb-idempotency": "exempt",
        "x-fb-idempotency-reason": "Immutable entity, row id and HLC version identity makes retries idempotent without caching a stale batch response.",
        "parameters": [
          {
            "$ref": "../components/headers.yaml#/components/parameters/AppVersion"
          },
          {
            "$ref": "../components/headers.yaml#/components/parameters/Platform"
          },
          {
            "$ref": "../components/headers.yaml#/components/parameters/DeviceId"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SyncPushRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Sync result; dataset mismatch never acknowledges or writes a version.",
            "headers": {
              "X-Request-Id": {
                "$ref": "../components/headers.yaml#/components/headers/XRequestId"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SyncPushResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "../components/problems.yaml#/components/responses/ValidationFailed"
          },
          "401": {
            "description": "Invalid credentials or inactive session.",
            "headers": {
              "X-Request-Id": {
                "$ref": "../components/headers.yaml#/components/headers/XRequestId"
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../components/problems.yaml#/components/schemas/ProblemDetails"
                }
              }
            }
          },
          "426": {
            "$ref": "../components/problems.yaml#/components/responses/UpgradeRequired"
          },
          "429": {
            "$ref": "../components/problems.yaml#/components/responses/RateLimited"
          },
          "500": {
            "$ref": "../components/problems.yaml#/components/responses/InternalError"
          },
          "403": {
            "description": "This account cannot perform this operation.",
            "headers": {
              "X-Request-Id": {
                "$ref": "../components/headers.yaml#/components/headers/XRequestId"
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../components/problems.yaml#/components/schemas/ProblemDetails"
                }
              }
            }
          }
        },
        "security": [
          {
            "bearerAuth": []
          }
        ]
      }
    },
    "/v1/sync/pull": {
      "get": {
        "tags": [
          "UserData"
        ],
        "operationId": "pullSync",
        "summary": "sync pull",
        "description": "Registered-user document sync; immutable HLC versions, dataset-bound admission and recoverable history. See technical-planning/05 section 5.",
        "parameters": [
          {
            "$ref": "../components/headers.yaml#/components/parameters/AppVersion"
          },
          {
            "$ref": "../components/headers.yaml#/components/parameters/Platform"
          },
          {
            "$ref": "../components/headers.yaml#/components/parameters/DeviceId"
          },
          {
            "name": "cursor",
            "in": "query",
            "required": true,
            "description": "Last delivered sequence; start at zero. History and document cursors are separate.",
            "schema": {
              "type": "string",
              "pattern": "^(0|[1-9][0-9]{0,18})$"
            }
          },
          {
            "name": "limit",
            "in": "query",
            "required": true,
            "description": "Maximum rows in this page (100 recommended).",
            "schema": {
              "type": "integer",
              "format": "int32"
            }
          },
          {
            "name": "datasetId",
            "in": "query",
            "required": false,
            "description": "Dataset binding; omit only when starting discovery at cursor zero.",
            "schema": {
              "type": [
                "string",
                "null"
              ],
              "format": "uuid"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Sync result; dataset mismatch never acknowledges or writes a version.",
            "headers": {
              "X-Request-Id": {
                "$ref": "../components/headers.yaml#/components/headers/XRequestId"
              }
