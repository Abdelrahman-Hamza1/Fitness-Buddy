{
  "paths": {
    "/v1/foods/search": {
      "get": {
        "tags": [
          "Catalog"
        ],
        "operationId": "searchFoods",
        "summary": "Search published catalog foods",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "parameters": [
          {
            "$ref": "../components/headers.yaml#/components/parameters/AppVersion"
          },
          {
            "$ref": "../components/headers.yaml#/components/parameters/Platform"
          },
          {
            "$ref": "../components/headers.yaml#/components/parameters/DeviceId"
          },
          {
            "name": "query",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 200
            }
          },
          {
            "name": "limit",
            "in": "query",
            "required": true,
            "schema": {
              "type": "integer",
              "format": "int32"
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "required": false,
            "schema": {
              "type": [
                "string",
                "null"
              ]
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Search published catalog foods",
            "headers": {
              "X-Request-Id": {
                "$ref": "../components/headers.yaml#/components/headers/XRequestId"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CatalogSearchPage"
                }
              }
            }
          },
          "400": {
            "$ref": "../components/problems.yaml#/components/responses/ValidationFailed"
          },
          "426": {
            "$ref": "../components/problems.yaml#/components/responses/UpgradeRequired"
          },
          "429": {
            "$ref": "../components/problems.yaml#/components/responses/RateLimited"
          },
          "500": {
            "$ref": "../components/problems.yaml#/components/responses/InternalError"
          },
          "503": {
            "$ref": "../components/problems.yaml#/components/responses/ServiceUnavailable"
          },
          "401": {
            "description": "Invalid credentials or inactive session.",
            "headers": {
              "X-Request-Id": {
                "$ref": "../components/headers.yaml#/components/headers/XRequestId"
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "../components/problems.yaml#/components/schemas/ProblemDetails"
                }
              }
            }
          }
        },
        "description": "Any authenticated account, including guests. Limit 1\u201350. Cursor is opaque and bound to the normalized query and current release; invalid, stale or mismatched cursors return 400. Empty normalized queries return no results. Results are deduplicated before pagination: verified basics, then reference variants; exact, prefix, token, substring and typo matches within each group, stable ID breaks ties. Personal results are merged on the phone (A24)."
      }
    },
