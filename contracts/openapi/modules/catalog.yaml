  "components": {
    "schemas": {
      "CatalogNutrients": {
        "type": "object",
        "required": [
          "kcal",
          "proteinG",
          "carbsG",
          "fatG",
          "fiberG"
        ],
        "properties": {
          "kcal": {
            "type": "number",
            "format": "double"
          },
          "proteinG": {
            "type": "number",
            "format": "double"
          },
          "carbsG": {
            "type": "number",
            "format": "double"
          },
          "fatG": {
            "type": "number",
            "format": "double"
          },
          "fiberG": {
            "type": "number",
            "format": "double"
          }
        }
      },
      "CatalogNutrientRange": {
        "type": "object",
        "required": [
          "low",
          "high"
        ],
        "properties": {
          "low": {
            "$ref": "#/components/schemas/CatalogNutrients"
          },
          "high": {
            "$ref": "#/components/schemas/CatalogNutrients"
          }
        }
      },
      "CatalogServing": {
        "type": "object",
        "required": [
          "unitCode",
          "g",
          "ml",
          "rangeLo",
          "rangeHi",
          "source"
        ],
        "properties": {
          "unitCode": {
            "type": "string"
          },
          "g": {
            "type": [
              "number",
              "null"
            ],
            "format": "double"
          },
          "ml": {
            "type": [
              "number",
              "null"
            ],
            "format": "double"
          },
          "rangeLo": {
            "type": [
              "number",
              "null"
            ],
            "format": "double"
          },
          "rangeHi": {
            "type": [
              "number",
              "null"
            ],
            "format": "double"
          },
          "source": {
            "type": "string"
          }
        }
      },
      "CatalogFood": {
        "type": "object",
        "required": [
          "catalogKey",
          "kind",
          "source",
          "sourceRef",
          "nameEn",
          "nameAr",
          "state",
          "verified",
          "catalogVersion",
          "nutrients",
          "ranges",
          "extras",
          "densityGPerMl",
          "yieldGroup",
          "servings"
        ],
        "properties": {
          "kind": {
            "type": "string"
          },
          "source": {
            "type": "string"
          },
          "sourceRef": {
            "type": [
              "string",
              "null"
            ]
          },
          "nameEn": {
            "type": "string"
          },
          "nameAr": {
            "type": [
              "string",
              "null"
            ]
          },
          "state": {
            "type": "string"
          },
          "verified": {
            "type": "boolean"
          },
          "catalogVersion": {
            "type": "integer",
            "format": "int32"
          },
          "nutrients": {
            "$ref": "#/components/schemas/CatalogNutrients"
          },
          "ranges": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/CatalogNutrientRange"
              },
              {
                "type": "null"
              }
            ]
          },
          "extras": {
            "type": [
              "object",
              "null"
            ],
            "additionalProperties": {
              "type": "number",
              "format": "double"
            }
          },
          "densityGPerMl": {
            "type": [
              "number",
              "null"
            ],
            "format": "double"
          },
          "yieldGroup": {
            "type": [
              "string",
              "null"
            ]
          },
          "servings": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/CatalogServing"
            }
          },
          "catalogKey": {
            "type": "string"
          }
        }
      },
      "CatalogSearchPage": {
        "type": "object",
        "required": [
          "items",
          "nextCursor"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/CatalogFood"
            }
          },
          "nextCursor": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      },
      "CatalogPack": {
        "type": "object",
        "required": [
          "version",
          "url",
          "sha256",
          "sizeBytes",
          "schemaVersion"
        ],
        "properties": {
          "version": {
            "type": "integer",
            "format": "int32"
          },
          "url": {
            "type": "string"
          },
          "sha256": {
            "type": "string"
          },
          "sizeBytes": {
            "type": "integer",
            "format": "int32"
          },
          "schemaVersion": {
            "type": "integer",
            "format": "int32"
          }
        }
      }
    }
  }
}
