name: fitness_buddy_workspace
description: Pub workspace root for Fitness Buddy. Holds no code of its own.
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - apps/mobile
  - packages/fb_api_client
  - packages/fb_domain
  - packages/fb_text
  - tools/app_check
  - tools/catalog
  - tools/trace
  - tools/buddy_eval
  - tools/sync_sim

dev_dependencies:
  very_good_analysis: 11.0.0
